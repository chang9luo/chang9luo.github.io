# Publication cards for index.html (English) and index-ja.html (Japanese).
#
# Edit this file only. Run `python3 scripts/build_publications.py` (or just push:
# the GitHub Action does it) and both pages are regenerated from it.
# News is NOT managed here; keep editing it directly in the HTML.
#
# Any text field can be a plain string (same in both languages) or a table
# { en = "...", ja = "..." } when the two pages should differ.
# Cards appear on the page in the order they are listed below.

# ---------------------------------------------------------------------------
# Link labels: a card's [publications.links] keys must come from this list.
# ---------------------------------------------------------------------------
[link_labels]
paper    = { en = "paper",            ja = "論文" }
arxiv    = "arXiv"
paper_ja = { en = "paper (Japanese)", ja = "和文抄録" }
website  = { en = "website",          ja = "プロジェクトページ" }
code     = { en = "code",             ja = "コード" }
data     = { en = "data",             ja = "データ" }
slides   = { en = "slides",           ja = "スライド" }
poster   = { en = "poster",           ja = "ポスター" }
video    = { en = "video",            ja = "動画" }
bibtex   = "bibtex"

# ---------------------------------------------------------------------------
# People. Reference them in `authors` by key; append "*" for equal contribution.
# `bold = true` renders the name in bold (you). `url` is optional.
# ---------------------------------------------------------------------------
[people.me]
name = { en = "Chang Luo", ja = "羅 暢" }
bold = true

[people.umetani]
name = { en = "Umetani Nobuyuki", ja = "梅谷 信行" }
url  = { en = "https://cgenglab.github.io/en/authors/admin/", ja = "https://cgenglab.github.io/ja/authors/admin/" }

[people.tang]
name = "Jiapeng Tang"
url  = "https://tangjiapeng.github.io"

[people.cao]
name = "Wei Cao"
url  = "https://vveicao.github.io/"

[people.zhang]
name = "Biao Zhang"
url  = "https://1zb.github.io/"

[people.liu]
name = "Yaoyao Liu"
url  = "https://yaoyaoliu.csl.illinois.edu/"

[people.niessner]
name = "Matthias Nießner"
url  = "http://niessnerlab.org/members/matthias_niessner/profile.html"

# ---------------------------------------------------------------------------
# Cards. Fields: image, image_width (default 190), title, authors, venue,
# year (optional), links, hidden (optional, true keeps the card off the page).
# ---------------------------------------------------------------------------
[[publications]]
