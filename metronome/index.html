<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Unlisted personal tool: not linked from the homepage, not in the sitemap. -->
<meta name="robots" content="noindex, nofollow">
<title>Metronome &amp; Tuner</title>
<link rel="icon" href="icon.svg">
<!-- Light by day, dark by night, with the homepage's own logic and toggle. -->
<script src="../tz-coords.js"></script>
<script src="../theme.js"></script>
<style>
  /* Colours follow the homepage: light by default, dark when ../theme.js sets data-theme="dark". */
  :root {
    color-scheme: light;
    --bg: #e8eaed; --panel: #ffffff; --line: #d4d4d4; --text: #000000; --muted: #666666;
    --accent: #1772d0; --on-accent: #ffffff; --btn: #f2f2f2; --btn-hover: #e6e6e6;
    --desk: radial-gradient(ellipse at 50% 30%, #f4f5f7, #d5d8dd);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #101216; --panel: #15181d; --line: #363b44; --text: #e4e6ea; --muted: #99a2ad;
    --accent: #6ab0f3; --on-accent: #0d1117; --btn: #23272e; --btn-hover: #2c313a;
    --desk: radial-gradient(ellipse at 50% 30%, #23272e, #0c0e11);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  header button {
    font: inherit; color: var(--text); background: var(--btn);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  header button:hover { background: var(--btn-hover); }
  /* the same Home pill as on the project pages */
  .home-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px;
    background: var(--btn); border: 1px solid var(--line); color: var(--text);
    font-weight: 600; text-decoration: none;
  }
  .home-link:hover { background: var(--btn-hover); }
  header .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
  }
  .theme-toggle svg { display: block; width: 15px; height: 15px; }
  .theme-toggle .icon-sun, [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  main {
    flex: 1; min-height: 0; overflow: auto; background: var(--desk);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 12px;
  }
  #message { min-height: 1.5em; color: var(--muted); font-size: 13px; text-align: center; }

  /* ---------- the device: a pocket metronome and tuner, drawn as an object ---------- */
  .device {
    position: relative; width: 400px; max-width: 100%; padding: 18px 20px 20px;
    border-radius: 26px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, 0) 12%),
      linear-gradient(160deg, #3b3f46, #24272c 55%, #1a1c20);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -3px 6px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .5),
      0 2px 2px rgba(0, 0, 0, .3), 0 18px 34px rgba(0, 0, 0, .38), 0 40px 60px -20px rgba(0, 0, 0, .35);
    color: #c9ced6;
  }
  /* the speaker: rows of punched holes */
  .grille {
    height: 26px; margin: 0 70px 12px; border-radius: 13px;
    background:
      radial-gradient(circle at 50% 42%, #08090a 0 1.5px, rgba(255, 255, 255, .1) 1.6px 2.1px, transparent 2.2px) 0 0 / 8px 8px,
      linear-gradient(180deg, #1c1e22, #2a2d32);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .09);
  }
  /* the lamps over the display */
  .lamps { display: flex; justify-content: center; gap: 26px; margin-bottom: 10px; }
  .lamp {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5c2f2b, #2a1210 70%);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .12);
  }
  .lamp.green { background: radial-gradient(circle at 35% 30%, #2f5a37, #102514 70%); }
  .lamp.lit { background: radial-gradient(circle at 35% 30%, #ffd9cf, #ff4b2e 45%, #b51e08); box-shadow: 0 0 12px 3px rgba(255, 75, 46, .75), inset 0 1px 1px rgba(255, 255, 255, .6); }
  .lamp.green.lit { background: radial-gradient(circle at 35% 30%, #e2ffe0, #3ee05a 45%, #129a2c); box-shadow: 0 0 12px 3px rgba(62, 224, 90, .7), inset 0 1px 1px rgba(255, 255, 255, .6); }

  /* the liquid crystal display, behind its window */
  .window {
    padding: 9px; border-radius: 12px; background: linear-gradient(180deg, #0c0d0f, #1b1d21);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 255, 255, .1);
  }
  .lcd {
    position: relative; display: block; width: 100%; border-radius: 5px;
    background: linear-gradient(180deg, #aebb9b, #c3ceb0 45%, #b4c0a0);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45), inset 0 0 22px rgba(60, 80, 40, .22);
  }
  .lcd svg { display: block; width: 100%; height: auto; }
  /* the gloss of the window over the display */
  .lcd::after {
    content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, .22) 0 18%, rgba(255, 255, 255, 0) 38%);
  }
  .ink { fill: #1c2619; }
  .ghost { fill: #1c2619; opacity: .07; }
  .lcd text { fill: #1c2619; font-family: "DejaVu Sans Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 700; }
  .lcd .off { opacity: .1; }

  .plate {
    display: flex; justify-content: space-between; align-items: baseline; margin: 9px 4px 12px;
    font: 700 10px/1 system-ui, sans-serif; letter-spacing: .16em; color: #8f96a1; text-shadow: 0 1px 0 rgba(0, 0, 0, .7);
  }
  .plate b { font-size: 12px; color: #c9ced6; letter-spacing: .22em; }

  .controls { display: grid; grid-template-columns: 148px 1fr; gap: 16px; align-items: center; }

  /* the dial: turned to set the tempo */
  .dial-well {
    position: relative; width: 148px; height: 148px; border-radius: 50%;
    background: radial-gradient(circle, #101113 60%, #26292e 61%, #17181b);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .85), 0 1px 0 rgba(255, 255, 255, .1);
  }
  #dial {
    position: absolute; inset: 9px; border-radius: 50%; cursor: grab; touch-action: none;
    /* a knurled rim */
    background: repeating-conic-gradient(#4a4e56 0deg 3deg, #25272b 3deg 6deg);
    box-shadow: 0 5px 9px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(0, 0, 0, .6);
  }
  #dial:active { cursor: grabbing; }
  #dial::before {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #6a6f79, #3a3d44 45%, #25272c);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .28), inset 0 -3px 5px rgba(0, 0, 0, .5), 0 0 0 1px rgba(0, 0, 0, .55);
  }
  /* the dimple a finger turns it by */
  #dial::after {
    content: ""; position: absolute; left: 50%; top: 20px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #17181b, #34373d);
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .16);
  }

  .keys { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
  /* rubber keys */
  .key {
    position: relative; height: 38px; padding: 0; border: 0; border-radius: 9px; cursor: pointer;
    font: 700 10px/1 system-ui, "Noto Sans CJK SC", sans-serif; letter-spacing: .08em; color: #e3e6ea;
    background: linear-gradient(180deg, #5d626b, #3f434a);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -2px 2px rgba(0, 0, 0, .35), 0 3px 0 #15161a, 0 4px 5px rgba(0, 0, 0, .5);
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .6);
    transition: transform .04s, box-shadow .04s;
  }
  .key:active, .key.down {
    transform: translateY(2px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), inset 0 -1px 2px rgba(0, 0, 0, .35), 0 1px 0 #15161a, 0 2px 3px rgba(0, 0, 0, .5);
  }
  .key.wide { grid-column: span 3; height: 46px; font-size: 13px; letter-spacing: .14em; background: linear-gradient(180deg, #e8603f, #b93a1d); }
  .key.wide.running { background: linear-gradient(180deg, #5d626b, #3f434a); }
  .key.mode { background: linear-gradient(180deg, #4d7fb8, #2e5688); }

  .feet { display: flex; justify-content: space-between; margin: 14px 6px 0; font: 600 9px/1 system-ui, sans-serif; letter-spacing: .14em; color: #6f7681; }
</style>
</head>
<body>
<header>
  <a class="home-link" href="../" title="Back to Chang Luo's homepage">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h5v-6h4v6h5v-9.5"/></svg>
    <span data-i18n="home"></span>
  </a>
  <span class="hint" data-i18n="hint"></span>
  <button id="lang"></button>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 1.6v2.6M12 19.8v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.6 12h2.6M19.8 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"></path></svg>
  </button>
</header>
<main>
  <div class="device">
    <div class="grille"></div>
    <div class="lamps">
      <div class="lamp" id="lampLeft"></div>
      <div class="lamp green" id="lampMid"></div>
      <div class="lamp" id="lampRight"></div>
    </div>
    <div class="window"><div class="lcd">
      <svg viewBox="0 0 340 176" id="lcd">
        <!-- top line: the mode, and what is set -->
        <text x="12" y="19" font-size="11" id="lcdMode"></text>
        <text x="328" y="19" font-size="11" text-anchor="end" id="lcdRight"></text>
        <!-- the scale the needle swings over -->
        <g id="scale"></g>
        <g id="needle"><path class="ink" d="M168.6 150 L169.4 44 L170.6 44 L171.4 150 Z"/></g>
        <circle class="ink" cx="170" cy="150" r="6"/>
        <!-- bottom line: the large figures on the left, a word on the right -->
        <g id="digits" transform="translate(12, 112)"></g>
        <text x="96" y="140" font-size="26" id="lcdNote"></text>
        <text x="328" y="150" font-size="13" text-anchor="end" id="lcdWord"></text>
        <text x="328" y="134" font-size="11" text-anchor="end" id="lcdSmall"></text>
        <g id="beats" transform="translate(12, 160)"></g>
      </svg>
    </div></div>
    <div class="plate"><b>TEMPO · PITCH</b><span>MT-1 QUARTZ</span></div>
    <div class="controls">
      <div class="dial-well"><div id="dial" role="slider" aria-label="Tempo" tabindex="0"></div></div>
      <div class="keys">
        <button class="key mode" id="mode" data-i18n="kMode"></button>
        <button class="key" id="beat" data-i18n="kBeat"></button>
        <button class="key" id="rhythm" data-i18n="kRhythm"></button>
        <button class="key" id="minus">−</button>
        <button class="key" id="tap" data-i18n="kTap"></button>
        <button class="key" id="plus">+</button>
        <button class="key wide" id="start"></button>
      </div>
    </div>
    <div class="feet"><span data-i18n="foot1"></span><span data-i18n="foot2"></span></div>
  </div>
  <div id="message"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';

// English unless the other language was picked with the toggle before.
const TEXT = {
  en: {
    title: 'Metronome & Tuner', other: '中文', home: 'Home',
    hint: 'Space starts and stops · ↑ ↓ change the tempo · T taps · M switches to the tuner',
    kMode: 'MODE', kBeat: 'BEAT', kRhythm: 'RHYTHM', kTap: 'TAP', start: 'START', stop: 'STOP', sound: 'SOUND', calib: 'CALIB',
    foot1: 'TURN THE DIAL', foot2: '30 – 252',
    metronome: 'METRONOME', tuner: 'TUNER',
    listen: 'Play or sing a note near the microphone.', noMic: 'The microphone could not be opened: the tuner needs it.',
    tone: 'Sounding {x}. Turn the dial for another note.',
    inTune: 'In tune', flat: 'Flat: tune up', sharp: 'Sharp: tune down',
  },
  zh: {
    title: '节拍器和调音器', other: 'English', home: '主页',
    hint: '空格开始/停止 · ↑ ↓ 调速度 · T 敲击测速 · M 切换调音器',
    kMode: '模式', kBeat: '拍数', kRhythm: '节奏型', kTap: '敲击', start: '开始', stop: '停止', sound: '标准音', calib: '校准',
    foot1: '转动旋钮', foot2: '30 – 252',
    metronome: 'METRONOME', tuner: 'TUNER',
    listen: '对着麦克风演奏或唱一个音。', noMic: '无法打开麦克风：调音器需要它。',
    tone: '正在发出 {x}。转动旋钮换一个音。',
    inTune: '准了', flat: '偏低：调高一点', sharp: '偏高：调低一点',
  },
};
let lang = 'en';
try { if (localStorage.getItem('metronome-lang') === 'zh') lang = 'zh'; } catch {}
const t = (key, x = '') => TEXT[lang][key].replace('{x}', x);

// What the device is set to; remembered between visits.
const DEFAULTS = { bpm: 100, beats: 4, rhythm: 0, a4: 440 };
let cfg = { ...DEFAULTS };
try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('metronome-settings') || '{}') }; } catch {}
// opened from a score: its tempo
const asked = +new URLSearchParams(location.search).get('bpm');
if (asked >= 30 && asked <= 252) cfg.bpm = Math.round(asked);

const RHYTHMS = [
  { sign: '♩', parts: [0] },                       // the beat alone
  { sign: '♫', parts: [0, 1 / 2] },                // eighths
  { sign: '♫³', parts: [0, 1 / 3, 2 / 3] },        // triplets
  { sign: '♬', parts: [0, 1 / 4, 2 / 4, 3 / 4] },  // sixteenths
];
const WORDS = [[40, 'GRAVE'], [52, 'LARGO'], [60, 'LARGHETTO'], [72, 'ADAGIO'], [88, 'ANDANTE'], [104, 'MODERATO'],
  [120, 'ALLEGRETTO'], [156, 'ALLEGRO'], [176, 'VIVACE'], [200, 'PRESTO'], [999, 'PRESTISSIMO']];
const NOTES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

let mode = 'metronome';   // or 'tuner'
let audio = null;
let message = { key: '', x: '' };

function say(key, x = '') {
  message = { key, x };
  $('message').textContent = key ? t(key, x) : '';
}
function save() {
  try { localStorage.setItem('metronome-settings', JSON.stringify(cfg)); } catch {}
}

// ---------- the display ----------

// Seven-segment figures, as on a pocket device: every figure shows all its segments faintly,
// and the ones that make the number darkly.
const SEGMENTS = {
  a: 'M5 0h22l-4 5H9z', b: 'M29 2v22l-5-3V7z', c: 'M29 28v22l-5-5V31z', d: 'M5 52h22l-4-5H9z',
  e: 'M3 28v22l5-5V31z', f: 'M3 2v22l5-3V7z', g: 'M6 26l3-3h14l3 3-3 3H9z',
};
const FIGURES = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abfgcd', '-': 'g', ' ': '' };
function showFigures(text) {
  const g = $('digits');
  g.replaceChildren();
  [...text.padStart(3)].forEach((ch, i) => {
    for (const [name, d] of Object.entries(SEGMENTS)) {
      const p = document.createElementNS(SVG, 'path');
      p.setAttribute('d', d);
      p.setAttribute('transform', `translate(${i * 26}, 0) scale(.68) skewX(-6)`);
      p.setAttribute('class', (FIGURES[ch] || '').includes(name) ? 'ink' : 'ghost');
      g.append(p);
    }
  });
}

// The arc of ticks: every fifth one long.
function drawScale() {
  const g = $('scale');
  for (let i = -25; i <= 25; i++) {
    const a = i * 1.8 * Math.PI / 180, long = i % 5 === 0, r1 = 110, r2 = long ? 98 : 104;
    const p = document.createElementNS(SVG, 'path');
    p.setAttribute('d', `M${170 + r1 * Math.sin(a)} ${150 - r1 * Math.cos(a)} L${170 + r2 * Math.sin(a)} ${150 - r2 * Math.cos(a)}`);
    p.setAttribute('stroke', '#1c2619'); p.setAttribute('stroke-width', i === 0 ? 2.6 : long ? 1.6 : .8);
    g.append(p);
  }
}
// the needle, from -1 (far left) to 1 (far right)
function needle(x) {
  $('needle').setAttribute('transform', `rotate(${Math.max(-1, Math.min(1, x)) * 45} 170 150)`);
}

// One mark for every beat of the bar; the beat that is sounding is filled.
function showBeats(current) {
  const g = $('beats');
  g.replaceChildren();
  for (let i = 0; i < (mode === 'metronome' ? cfg.beats : 0); i++) {
    const r = document.createElementNS(SVG, 'rect');
    r.setAttribute('x', i * 13); r.setAttribute('y', 0); r.setAttribute('width', 10); r.setAttribute('height', i === 0 ? 8 : 5);
    r.setAttribute('class', i === current ? 'ink' : 'ghost');
    if (i !== current) r.style.opacity = .28;
    g.append(r);
  }
}

function lamps(left, mid, right) {
  $('lampLeft').classList.toggle('lit', !!left);
  $('lampMid').classList.toggle('lit', !!mid);
  $('lampRight').classList.toggle('lit', !!right);
}

function show() {
  $('lcdMode').textContent = t(mode);
  if (mode === 'metronome') {
    showFigures(String(cfg.bpm));
    $('lcdNote').textContent = '';
    $('lcdRight').textContent = `BEAT ${cfg.beats || '–'}   ${RHYTHMS[cfg.rhythm].sign}`;
    $('lcdWord').textContent = WORDS.find(w => cfg.bpm < w[0])[1];
    $('lcdSmall').textContent = '♩ =';
    if (!running) { needle(0); showBeats(-1); lamps(); }
  } else {
    $('lcdRight').textContent = `A4 = ${cfg.a4} Hz`;
    showBeats(-1);
    if (tone) { showFigures('   '); $('lcdNote').textContent = NOTES[toneNote % 12] + (Math.floor(toneNote / 12) - 1); $('lcdWord').textContent = toneHz().toFixed(1) + ' Hz'; $('lcdSmall').textContent = 'SOUND'; needle(0); lamps(0, 1, 0); }
  }
  $('start').textContent = t(mode === 'metronome' ? (running ? 'stop' : 'start') : 'sound');
  $('start').classList.toggle('running', mode === 'metronome' ? running : !!tone);
  $('beat').textContent = mode === 'metronome' ? t('kBeat') : t('calib') + ' −';
  $('rhythm').textContent = mode === 'metronome' ? t('kRhythm') : t('calib') + ' +';
  $('tap').textContent = mode === 'metronome' ? t('kTap') : 'A4';
  $('dial').style.transform = `rotate(${mode === 'metronome' ? (cfg.bpm - 30) * 6 : toneNote * 30}deg)`;
}

// ---------- the metronome ----------

let running = false, timer = 0, frame = 0;
let nextBeat = 0;        // audio time of the next beat
let count = 0;           // which beat of the bar that is
let shownBeats = [];     // beats already scheduled, for the display: { time, index, length }

// The tick of a quartz metronome: a short sine that dies away. Higher on the first beat of the bar.
function tick(at, kind) {
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.frequency.value = kind === 'bar' ? 1760 : kind === 'beat' ? 1175 : 880;
  gain.gain.setValueAtTime(kind === 'part' ? .16 : .5, at);
  gain.gain.exponentialRampToValueAtTime(.0008, at + (kind === 'part' ? .03 : .055));
  osc.connect(gain).connect(audio.destination);
  osc.start(at); osc.stop(at + .08);
}

// Beats are put on the audio clock a little ahead of time, so they stay exact whatever the page is doing.
function schedule() {
  while (nextBeat < audio.currentTime + .12) {
    const length = 60 / cfg.bpm;
    const bar = cfg.beats > 0 && count === 0;
    for (const part of RHYTHMS[cfg.rhythm].parts) tick(nextBeat + part * length, part ? 'part' : bar ? 'bar' : 'beat');
    shownBeats.push({ time: nextBeat, index: count, length });
    nextBeat += length;
    count = cfg.beats > 0 ? (count + 1) % cfg.beats : 0;
  }
}

// The needle swings like a pendulum: at one end on every beat.
function animate() {
  if (!running) return;
  const now = audio.currentTime;
  while (shownBeats.length > 1 && shownBeats[1].time <= now) shownBeats.shift();
  const b = shownBeats[0];
  if (b && b.time <= now) {
    const phase = Math.min(1, (now - b.time) / b.length), side = b.swing ??= (animate.side = -(animate.side || 1));
    needle(side * Math.cos(phase * Math.PI));
    showBeats(b.index);
    const flash = now - b.time < .09;
    const first = cfg.beats > 0 && b.index === 0;
    lamps(flash && first, flash && !first, flash && first);
  }
  frame = requestAnimationFrame(animate);
}

async function start() {
  audio ||= new AudioContext();
  await audio.resume();
  running = true;
  count = 0; shownBeats = [];
  nextBeat = audio.currentTime + .08;
  schedule();
  timer = setInterval(schedule, 25);
  frame = requestAnimationFrame(animate);
  show();
}
function stop() {
  running = false;
  clearInterval(timer);
  cancelAnimationFrame(frame);
  show();
}

function setBpm(v) {
  cfg.bpm = Math.max(30, Math.min(252, Math.round(v)));
  save(); show();
}

// The tempo of the last few taps.
let taps = [];
function tap() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 6) taps.shift();
  if (taps.length > 1) setBpm(60000 * (taps.length - 1) / (now - taps[0]));
}

// ---------- the tuner ----------

let mic = null;          // { stream, analyser, data }
let tunerFrame = 0;
let tone = null;         // the reference tone, while it sounds: { osc, gain }
let toneNote = 69;       // which note the reference tone is, as a MIDI number (A4)
let steady = 0;          // the cents shown, smoothed
const toneHz = () => cfg.a4 * 2 ** ((toneNote - 69) / 12);

// The pitch of a stretch of sound, by autocorrelation: the lag at which the wave best matches
// itself is its period. Returns 0 when there is no clear pitch.
function pitchOf(data, rate) {
  let energy = 0;
  for (const v of data) energy += v * v;
  if (energy / data.length < 2e-4) return 0;   // too quiet
  const n = data.length >> 1, min = Math.floor(rate / 2100), max = Math.min(n - 1, Math.floor(rate / 50));
  // the normalised square difference of the wave and itself shifted by `lag` (as in the YIN method)
  const diff = new Float32Array(max + 2), raw = new Float32Array(max + 2);
  let sum = 0, best = 0;
  for (let lag = 1; lag <= max + 1; lag++) {
    let d = 0;
    for (let i = 0; i < n; i++) { const x = data[i] - data[i + lag]; d += x * x; }
    sum += d;
    raw[lag] = d;
    diff[lag] = sum ? d * lag / sum : 1;
  }
  for (let lag = min; lag <= max; lag++) {
    if (diff[lag] < .12) {
      // the lowest point of this dip: the first one deep enough is the period, later ones its multiples
      for (best = lag; lag <= max && diff[lag] < .12; lag++) if (raw[lag] < raw[best]) best = lag;
      break;
    }
  }
  if (!best) return 0;
  // between the samples: the low point of the parabola through the three values around it
  const a = raw[best - 1], b = raw[best], c = raw[best + 1], shift = a + c - 2 * b ? (a - c) / (2 * (a + c - 2 * b)) : 0;
  return rate / (best + shift);
}

function listen() {
  if (mode !== 'tuner') return;
  tunerFrame = requestAnimationFrame(listen);
  if (!mic || tone) return;
  mic.analyser.getFloatTimeDomainData(mic.data);
  const hz = pitchOf(mic.data, audio.sampleRate);
  if (!hz) {
    if (performance.now() - listen.heard > 900) { showFigures('---'); $('lcdNote').textContent = ''; $('lcdWord').textContent = ''; $('lcdSmall').textContent = ''; needle(0); lamps(); say('listen'); }
    return;
  }
  listen.heard = performance.now();
  const exact = 69 + 12 * Math.log2(hz / cfg.a4), note = Math.round(exact), cents = (exact - note) * 100;
  // a new note jumps, the same note settles
  steady = note === listen.note ? steady + (cents - steady) * .25 : cents;
  listen.note = note;
  const shown = Math.round(steady);
  showFigures((shown < 0 ? '-' : ' ') + String(Math.abs(shown)).padStart(2));
  $('lcdNote').textContent = NOTES[((note % 12) + 12) % 12] + (Math.floor(note / 12) - 1);
  $('lcdWord').textContent = hz.toFixed(1) + ' Hz';
  $('lcdSmall').textContent = 'CENT';
  needle(steady / 50);
  const ok = Math.abs(steady) <= 4;
  lamps(!ok && steady < 0, ok, !ok && steady > 0);
  say(ok ? 'inTune' : steady < 0 ? 'flat' : 'sharp');
}

async function openMic() {
  if (mic) return;
  try {
    audio ||= new AudioContext();
    await audio.resume();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const analyser = audio.createAnalyser();
    analyser.fftSize = 4096;
    audio.createMediaStreamSource(stream).connect(analyser);
    mic = { stream, analyser, data: new Float32Array(analyser.fftSize) };
    say('listen');
  } catch (err) {
    console.error(err);
    say('noMic');
  }
}
function closeMic() {
  if (!mic) return;
  for (const track of mic.stream.getTracks()) track.stop();
  mic = null;
}

// The reference tone: a steady note to tune to by ear.
async function toggleTone() {
  if (tone) {
    tone.gain.gain.setTargetAtTime(0, audio.currentTime, .03);
    tone.osc.stop(audio.currentTime + .2);
    tone = null;
    say(mic ? 'listen' : 'noMic');
  } else {
    audio ||= new AudioContext();
    await audio.resume();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = 'triangle';
    osc.frequency.value = toneHz();
    gain.gain.setValueAtTime(0, audio.currentTime);
    gain.gain.setTargetAtTime(.25, audio.currentTime, .03);
    osc.connect(gain).connect(audio.destination);
    osc.start();
    tone = { osc, gain };
    say('tone', NOTES[toneNote % 12] + (Math.floor(toneNote / 12) - 1));
  }
  show();
}
function setTone(note) {
  toneNote = Math.max(36, Math.min(96, note));
  if (tone) { tone.osc.frequency.setTargetAtTime(toneHz(), audio.currentTime, .01); say('tone', NOTES[toneNote % 12] + (Math.floor(toneNote / 12) - 1)); }
  show();
}
function setA4(v) {
  cfg.a4 = Math.max(410, Math.min(480, v));
  save();
  if (tone) tone.osc.frequency.setTargetAtTime(toneHz(), audio.currentTime, .01);
  show();
}

function setMode(next) {
  if (next === mode) return;
  if (mode === 'metronome' && running) stop();
  if (mode === 'tuner') { if (tone) toggleTone(); cancelAnimationFrame(tunerFrame); closeMic(); }
  mode = next;
  lamps(); needle(0); say('');
  if (mode === 'tuner') { showFigures('---'); $('lcdWord').textContent = $('lcdSmall').textContent = $('lcdNote').textContent = ''; openMic(); listen.heard = 0; tunerFrame = requestAnimationFrame(listen); }
  show();
}

// ---------- the keys and the dial ----------

$('start').onclick = () => mode === 'metronome' ? (running ? stop() : start()) : toggleTone();
$('mode').onclick = () => setMode(mode === 'metronome' ? 'tuner' : 'metronome');
$('beat').onclick = () => { if (mode === 'metronome') { cfg.beats = (cfg.beats + 1) % 8; count = 0; save(); show(); } else setA4(cfg.a4 - 1); };
$('rhythm').onclick = () => { if (mode === 'metronome') { cfg.rhythm = (cfg.rhythm + 1) % RHYTHMS.length; save(); show(); } else setA4(cfg.a4 + 1); };
$('minus').onclick = () => mode === 'metronome' ? setBpm(cfg.bpm - 1) : setTone(toneNote - 1);
$('plus').onclick = () => mode === 'metronome' ? setBpm(cfg.bpm + 1) : setTone(toneNote + 1);
$('tap').onclick = () => mode === 'metronome' ? tap() : (setA4(440), setTone(69));

// Turning the dial: six degrees to a beat per minute, thirty to a semitone.
let grip = null;
const angle = e => { const r = $('dial').getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
$('dial').onpointerdown = e => { $('dial').setPointerCapture(e.pointerId); grip = { last: angle(e), turned: 0, bpm: cfg.bpm, note: toneNote }; };
$('dial').onpointermove = e => {
  if (!grip) return;
  let d = angle(e) - grip.last;
  if (d > 180) d -= 360; else if (d < -180) d += 360;
  grip.last += d; grip.turned += d;
  if (mode === 'metronome') setBpm(grip.bpm + grip.turned / 6); else setTone(grip.note + Math.round(grip.turned / 30));
};
$('dial').onpointerup = $('dial').onpointercancel = () => { grip = null; };
$('dial').onwheel = e => { e.preventDefault(); const d = e.deltaY < 0 ? 1 : -1; if (mode === 'metronome') setBpm(cfg.bpm + d); else setTone(toneNote + d); };

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase(), step = e.shiftKey ? 10 : 1;
  const press = id => { $(id).classList.add('down'); setTimeout(() => $(id).classList.remove('down'), 90); $(id).click(); };
  if (k === ' ') { e.preventDefault(); press('start'); }
  else if (k === 'arrowup' || k === 'arrowright') { e.preventDefault(); if (mode === 'metronome') setBpm(cfg.bpm + step); else setTone(toneNote + 1); }
  else if (k === 'arrowdown' || k === 'arrowleft') { e.preventDefault(); if (mode === 'metronome') setBpm(cfg.bpm - step); else setTone(toneNote - 1); }
  else if (k === 't') press('tap');
  else if (k === 'm') press('mode');
  else if (k === 'b') press('beat');
  else if (k === 'r') press('rhythm');
});

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('lang').textContent = t('other');
  say(message.key, message.x);
  show();
}
$('lang').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('metronome-lang', lang); } catch {}
  applyLang();
};

drawScale();
applyLang();
</script>
</body>
</html>
