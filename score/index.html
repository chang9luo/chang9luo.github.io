  placeCursor();
}

// ---------- recognition ----------

let worker = null, job = 0, started = 0;
let top = null;         // promise of what was read at the top of the picture
let reader = null;      // promise of the OCR worker

const TEMPO_WORDS = {
  grave: 40, largo: 50, lento: 56, larghetto: 60, adagio: 70, andante: 84, andantino: 92, moderato: 108,
  allegretto: 116, allegro: 132, vivace: 160, presto: 180, prestissimo: 200,
};

// Title, subtitle, composer and tempo, from the strip of the picture above the first staff.
// The title is the large line in the middle and the subtitle the line under it; what stands at the
// right edge names the composer; the tempo is a number after an equals sign (as in "♩ = 96"),
// or else a tempo word.
async function readHeader(png) {
  await loadScript(TESSERACT);
  reader ||= Tesseract.createWorker(['eng', 'chi_sim', 'jpn']);
  reader.catch(() => { reader = null; });
  // small print reads better enlarged
  const small = await createImageBitmap(png), zoom = Math.min(4, Math.max(1, 2400 / small.width));
  const canvas = document.createElement('canvas');
  const W = canvas.width = Math.round(small.width * zoom);
  canvas.height = Math.round(small.height * zoom);
  const g = canvas.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(small, 0, 0, canvas.width, canvas.height);
  const { data } = await (await reader).recognize(canvas, {}, { blocks: true });

  // Words that stand together make a line; a stray mark far away on the same height does not belong.
  const lines = [];
  const cjk = /[\u3040-\u30ff\u3400-\u9fff]/;
  for (const line of (data.blocks || []).flatMap(b => b.paragraphs).flatMap(p => p.lines)) {
    const height = line.bbox.y1 - line.bbox.y0;
    let group = [];
    const close = () => {
      if (group.length) lines.push({
        text: group.reduce((text, w) => text + (text && !(cjk.test(text.slice(-1)) && cjk.test(w.text[0])) ? ' ' : '') + w.text, ''),
        confidence: Math.min(...group.map(w => w.confidence)), height, top: line.bbox.y0,
        left: group[0].bbox.x0, right: group[group.length - 1].bbox.x1,
      });
      group = [];
    };
    for (const word of line.words) {
      if (!word.text.trim()) continue;
      if (group.length && word.bbox.x0 - group[group.length - 1].bbox.x1 > 2.5 * height) close();
      group.push(word);
    }
    close();
  }
  if (QUERY.has('debug')) console.log(JSON.stringify(lines));

  const found = {};
  const all = lines.map(l => l.text).join('\n');
  const number = /[=＝]\s*(?:c(?:a|irca)?\.?\s*)?(\d{2,3})(?!\d)/.exec(all);
  if (number && +number[1] >= 30 && +number[1] <= 260) found.bpm = +number[1];
  else {
    const word = all.toLowerCase().match(new RegExp('\\b(' + Object.keys(TEMPO_WORDS).join('|') + ')\\b'));
    if (word) found.bpm = TEMPO_WORDS[word[1]];
  }
  // read with some confidence, and real words
  const words = lines.filter(l => l.confidence > 55 && /\p{L}{2,}/u.test(l.text) && !/[=＝]\s*\d/.test(l.text));
  const off = l => Math.abs((l.left + l.right) / 2 - W / 2) / (W / 2);   // 0 in the middle, 1 at an edge
  const middle = words.filter(l => off(l) < .4);
  if (middle.length) {
    const tallest = Math.max(...middle.map(l => l.height));
    const rank = l => .3 * l.height / tallest + .7 * (1 - off(l));
    const title = middle.slice().sort((a, b) => rank(b) - rank(a))[0];
    found.title = title.text;
    const under = middle.filter(l => l !== title && l.top > title.top && l.height <= title.height).sort((a, b) => a.top - b.top)[0];
    if (under) found.subtitle = under.text;
  }
  const right = words.filter(l => l.right > .72 * W && (l.left + l.right) / 2 > .6 * W && l.text !== found.title && l.text !== found.subtitle);
  if (right.length) found.composer = right.sort((a, b) => a.top - b.top).map(l => l.text).join('\n');
  return found;
}

function recognise(blob) {
  if (typeof WebAssembly?.Suspending !== 'function') { say('needsJspi', '', true); return; }
  if (!worker) {
    worker = new Worker('omr-worker.mjs', { type: 'module' });
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === 'stage') {
        if (m.stage === 'download') { $('bar').hidden = false; $('bar').firstElementChild.style.width = m.extra + '%'; }
        else $('bar').hidden = true;
        say(m.stage, m.extra ?? '');
        busy(t(m.stage, m.extra ?? ''));
      } else if (m.type === 'log') {
        console.warn(m.line);
      } else if (m.id !== job) {
        // an older picture: nothing to do with it
      } else if (m.type === 'header') {
        // read while the staves are being recognised
        top = readHeader(new Blob([m.png], { type: 'image/png' })).catch(err => { console.error(err); return {}; });
        // the same proportions as the picture: as many staff heights across the page
        if (m.unit > 0 && m.width > 0) {
          const across = PAPERS[cfg.paper][0] - 2 * MARGIN;
          cfg.size = Math.min(130, Math.max(40, Math.round(100 * (4 * m.unit / m.width) * across / 7.2)));
          showSettings();
        }
      } else {
        $('bar').hidden = true;
        if (m.type === 'done') {
          const mine = job;
          (async () => {
            if (top) { say('header'); busy(t('header')); }
            const found = await Promise.race([top || {}, new Promise(res => setTimeout(res, 40000, {}))]);
            if (mine !== job) return;
            busy('');
            for (const key of ['title', 'subtitle', 'composer', 'bpm']) if (found[key] && !$(key).value) $(key).value = found[key];
            await setScore(fromPicture(m.xml));
            if (!status.bad) say('recognised', ((performance.now() - started) / 1000).toFixed(0));
          })();
        } else {
          busy('');
          say('omrFailed', '', true, m.message);
          $('empty').hidden = shown;   // nothing to show: back to the invitation
        }
      }
    };
    worker.onerror = e => { busy(''); say('omrFailed', '', true, e.message || 'worker'); worker = null; };
  }
  (async () => {
    // Whatever the picture is, the recogniser gets a PNG on white.
    let bitmap;
    try { bitmap = await createImageBitmap(blob); } catch { toast(t('badFile'), true); return; }
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width; canvas.height = bitmap.height;
    const g = canvas.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height);
    g.drawImage(bitmap, 0, 0);
    const png = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if ($('original').src) URL.revokeObjectURL($('original').src);
    $('original').src = URL.createObjectURL(png);
    showSource(true, 'picture');
    $('empty').hidden = true;
    started = performance.now();
    top = null;
    forget();
    say('runtime'); busy(t('runtime'));
    const image = await png.arrayBuffer();
    worker.postMessage({ id: ++job, image, models: MODELS }, [image]);
  })();
}

// the names and the tempo in the side panel belonged to the score before
function forget() {
  for (const id of ['title', 'subtitle', 'composer', 'bpm']) $(id).value = '';
}

async function openFile(file) {
  const lower = file.name.toLowerCase();
  if (file.type.startsWith('image/')) {
    name = file.name.replace(/\.[^.]+$/, '') || 'score';
    recognise(file);
  } else if (/\.(musicxml|xml|mei|abc)$/.test(lower)) {
    name = file.name.replace(/\.[^.]+$/, '');
    forget();
    setScore(await file.text());
  } else if (lower.endsWith('.mxl')) {
    // compressed MusicXML: Verovio unpacks it; the text pane then holds its MEI
    name = file.name.replace(/\.[^.]+$/, '');
    await engine;
    forget();
    if (tk.loadZipDataBuffer(await file.arrayBuffer())) setScore(tk.getMEI());
    else say('badScore', '', true, file.name);
  } else toast(t('badFile'), true);
}

// ---------- changing a note ----------

const STEPS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const SHARPS = 'FCGDAEB';   // the order in which key signatures add sharps; flats come in reverse
const WITH_SHARPS = [['C', 0], ['C', 1], ['D', 0], ['D', 1], ['E', 0], ['F', 0], ['F', 1], ['G', 0], ['G', 1], ['A', 0], ['A', 1], ['B', 0]];
const WITH_FLATS = [['C', 0], ['D', -1], ['D', 0], ['E', -1], ['E', 0], ['F', 0], ['G', -1], ['G', 0], ['A', -1], ['A', 0], ['B', -1], ['B', 0]];
const SIGNS = { '-2': 'flat-flat', '-1': 'flat', 0: 'natural', 1: 'sharp', 2: 'double-sharp' };
const SHOWN = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };

// what the key signature does to a note of this name
const inKey = (fifths, step) => fifths > 0 && SHARPS.indexOf(step) < fifths ? 1
  : fifths < 0 && 6 - SHARPS.indexOf(step) < -fifths ? -1 : 0;

// The note of the score text that the picked note on the page stands for.
function pickedNote(doc) {
  const m = /^n(\d+)$/.exec(selected || '');
  const el = m && isMusicXml(score) ? doc.querySelectorAll('note')[+m[1]] : null;
  return el?.querySelector('pitch') ? el : null;
}

function readPitch(el) {
  const pitch = el.querySelector('pitch');
  return {
    step: pitch.querySelector('step').textContent.trim(),
    alter: Math.round(+(pitch.querySelector('alter')?.textContent || 0)),
    octave: +pitch.querySelector('octave').textContent,
  };
}

// The key signature in force at a measure.
function keyAt(measure) {
  let fifths = 0;
  for (const m of measure.parentElement.children) {
    const key = m.querySelector(':scope > attributes > key > fifths');
    if (key) fifths = +key.textContent || 0;
    if (m === measure) break;
  }
  return fifths;
}

// Moves the picked note by semitones, or sets its accidental. The accidentals printed in its
// measure are then worked out again: a sign where a note differs from the key signature or from
// the same note earlier in the measure, and none where it does not.
function change(how) {
  const doc = parse(score), el = pickedNote(doc);
  if (!el) { if (selected) toast(t('notEditable'), true); return; }
  const doc0 = score, measure = el.closest('measure'), fifths = keyAt(measure);
  let { step, alter, octave } = readPitch(el);
  if ('set' in how) alter = how.set;
  else {
    const midi = 12 * (octave + 1) + STEPS[step] + alter + how.by;
    // spelled the way the key leans: with sharps in sharp keys, with flats in flat keys
    [step, alter] = (fifths < 0 ? WITH_FLATS : WITH_SHARPS)[((midi % 12) + 12) % 12];
    octave = Math.floor(midi / 12) - 1;
  }
  const pitch = el.querySelector('pitch');
  pitch.querySelector('step').textContent = step;
  pitch.querySelector('octave').textContent = octave;
  pitch.querySelector('alter')?.remove();
  if (alter) { const a = doc.createElement('alter'); a.textContent = alter; pitch.querySelector('step').after(a); }

  const state = new Map();
  for (const note of measure.querySelectorAll(':scope > note')) {
    if (!note.querySelector('pitch')) continue;
    const p = readPitch(note), key = (note.querySelector('staff')?.textContent || '1') + p.step + p.octave;
    const before = state.has(key) ? state.get(key) : inKey(fifths, p.step);
    note.querySelector(':scope > accidental')?.remove();
    // a note tied from the one before keeps that note's sign
    if (p.alter !== before && !note.querySelector('tie[type="stop"]')) {
      const sign = doc.createElement('accidental');
      sign.textContent = SIGNS[p.alter] || 'natural';
      note.insertBefore(sign, note.querySelector(':scope > time-modification, :scope > stem, :scope > notehead, :scope > staff, :scope > beam, :scope > notations, :scope > lyric'));
    }
    state.set(key, p.alter);
  }
  history.push(doc0);
  if (history.length > 200) history.shift();
  score = pretty(doc);
  $('text').value = score;
  if (engrave()) sayShown();
  blip(12 * (octave + 1) + STEPS[step] + alter);
}

// The repeat sign on one side of a measure: the one written there, if any.
const SIDES = { left: { style: 'heavy-light', direction: 'forward' }, right: { style: 'light-heavy', direction: 'backward' } };
function repeatAt(measure, side) {
  for (const bar of measure.querySelectorAll(':scope > barline')) {
    if ((bar.getAttribute('location') || 'right') === side && bar.querySelector('repeat')) return bar;
  }
  return null;
}

// Puts a repeat sign on that side of the picked note's measure, or takes it away: recognition
// mistakes the two kinds for each other. In every part, as a repeat is for all of them.
function toggleRepeat(side) {
  const doc = parse(score), el = pickedNote(doc);
  if (!el) { if (selected) toast(t('notEditable'), true); return; }
  const picked = el.closest('measure'), index = [...picked.parentElement.children].filter(m => m.tagName === 'measure').indexOf(picked);
  const on = !repeatAt(picked, side), { style, direction } = SIDES[side];
  for (const part of doc.querySelectorAll('part')) {
    const measure = [...part.children].filter(m => m.tagName === 'measure')[index];
    if (!measure) continue;
    const old = repeatAt(measure, side);
    if (old) {
      // a barline that also carries a volta bracket stays, without its repeat
      if (old.querySelector('ending')) { old.querySelector('repeat').remove(); old.querySelector('bar-style')?.remove(); }
      else old.remove();
    }
    if (!on) continue;
    let bar = [...measure.querySelectorAll(':scope > barline')].find(b => (b.getAttribute('location') || 'right') === side);
    if (!bar) {
      bar = doc.createElement('barline');
      bar.setAttribute('location', side);
      if (side === 'left') measure.prepend(bar); else measure.append(bar);
    }
    bar.querySelector('bar-style')?.remove();
    bar.querySelector('repeat')?.remove();
    const s = doc.createElement('bar-style'); s.textContent = style;
    const r = doc.createElement('repeat'); r.setAttribute('direction', direction);
    bar.prepend(s);    // the order MusicXML asks for: style first, the repeat last
    bar.append(r);
  }
  history.push(score);
  if (history.length > 200) history.shift();
  score = pretty(doc);
  $('text').value = score;
  if (engrave()) sayShown();
}

// ---------- the heading, edited on the page ----------

// On the first page, one small button for each of title, subtitle and names that is still empty.
function showHeadAdd() {
  const page = $('pages').querySelector('.page');
  if (!page) return;
  const box = document.createElement('div');
  box.id = 'headAdd';
  for (const field of ['title', 'subtitle', 'composer']) {
    if ($(field).value.trim()) continue;
    const b = document.createElement('button');
    b.textContent = '+ ' + t(field + 'Hint').split(/[,，（(]/)[0];
    b.onclick = () => editHead(field);
    box.append(b);
  }
  if (box.children.length) page.append(box);
}

// Opens a field over the heading of the first page. `over` is the text on the page that was
// clicked; without it the field goes where that part of the heading would be.
function editHead(field, over) {
  const page = $('pages').querySelector('.page');
  if (!page) return;
  $('headEdit')?.remove();
  const frame = page.getBoundingClientRect(), W = frame.width, lines = field === 'composer';
  const el = document.createElement(lines ? 'textarea' : 'input');
  el.id = 'headEdit';
  el.value = $(field).value || (over && !lines ? over.textContent.trim() : '');
  el.title = t(lines ? 'composerEditHint' : 'headEditHint');
  el.placeholder = t(field + 'Hint');
  // as large as the text it stands over, or as that part of a heading usually is
  let size = W * { title: .03, subtitle: .021, composer: .017 }[field], top = W * { title: .04, subtitle: .085, composer: .11 }[field];
  if (over) {
    const r = over.getBoundingClientRect(), n = lines ? Math.max(1, $(field).value.split('\n').filter(v => v.trim()).length) : 1;
    if (r.height > 4) { size = Math.max(11, r.height / n * .78); top = r.top - frame.top - 4; }
  }
  el.style.fontSize = size + 'px';
  el.style.top = top + 'px';
  if (lines) { el.rows = Math.max(2, el.value.split('\n').length + 1); el.style.right = '4%'; el.style.width = '42%'; el.style.textAlign = 'right'; }
  else { el.style.left = '12%'; el.style.width = '76%'; el.style.textAlign = 'center'; }
  let over_ = false;
  const finish = keep => {
    if (over_) return;
    over_ = true;
    const value = el.value.trim();
    el.remove();
    if (!keep || value === $(field).value.trim()) return;
    $(field).value = value;
    clearTimeout(relayout);
    if (engrave()) sayShown();
  };
  el.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Escape') finish(false);
    else if (e.key === 'Enter' && (!lines || e.ctrlKey || e.metaKey)) { e.preventDefault(); finish(true); }
  };
  el.onblur = () => finish(true);
  el.onclick = e => e.stopPropagation();
  page.append(el);
  el.focus();
  el.select();
}

const headKnown = el => { const said = el.textContent.replace(/\s+/g, ' ').trim(), h = heading(); return [h.title, h.subtitle, ...h.composer].some(v => v && v.replace(/\s+/g, ' ') === said); };

// Which part of the heading a piece of text on the page is.
function headField(text) {
  const said = text.textContent.replace(/\s+/g, ' ').trim(), { title, subtitle, composer } = heading();
  const same = v => v && said === v.replace(/\s+/g, ' ');
  if (same(title)) return 'title';
  if (same(subtitle)) return 'subtitle';
  if (composer.some(same)) return 'composer';
  // a heading that came with the file: by where it stands
  const r = text.getBoundingClientRect(), page = text.closest('.page').getBoundingClientRect();
  return (r.left + r.right) / 2 > page.left + page.width * .68 ? 'composer' : 'title';
}

function undo() {
  if (!history.length) return;
  score = history.pop();
  $('text').value = score;
  if (engrave()) sayShown();
}

// What is picked, in words and on the page.
function showPicked() {
  for (const el of $('pages').querySelectorAll('.selected')) el.classList.remove('selected');
  if (selected) document.getElementById(selected)?.classList.add('selected');
  const el = selected && isMusicXml(score) ? pickedNote(parse(score)) : null;
  if (el) { const p = readPitch(el); $('picked').textContent = p.step + SHOWN[p.alter] + p.octave; }
  else $('picked').textContent = t(selected && !isMusicXml(score) ? 'notEditable' : 'noNote');
  for (const id of ['flat', 'natural', 'sharp', 'down2', 'down1', 'up1', 'up2', 'repStart', 'repEnd']) $(id).disabled = !el;
  $('repStart').classList.toggle('on', !!el && !!repeatAt(el.closest('measure'), 'left'));
  $('repEnd').classList.toggle('on', !!el && !!repeatAt(el.closest('measure'), 'right'));
}

// ---------- playback ----------

let audio = null;
const sounds = new Map();      // instrument -> promise of Map(pitch -> base64 MP3)
const buffers = new Map();     // instrument + pitch -> promise of AudioBuffer
let playing = null;            // { t0, from, rate, voices, frame }

const NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

function loadSound(instrument) {
  if (!sounds.has(instrument)) {
    const p = fetch(SOUNDS + instrument + '-mp3.js').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(js => {
      const map = new Map();
      for (const m of js.matchAll(/"([A-G]b?)(-?\d)":\s*"data:audio\/mp3;base64,([^"]+)"/g)) {
        map.set(NAMES.indexOf(m[1]) + 12 * (+m[2] + 1), m[3]);
      }
      return map;
    });
    p.catch(() => sounds.delete(instrument));
    sounds.set(instrument, p);
  }
  return sounds.get(instrument);
}

// Only the pitches that are asked for are decoded.
async function loadBuffers(instrument, pitches) {
  const map = await loadSound(instrument);
  await Promise.all([...pitches].map(pitch => {
    const key = instrument + pitch;
    if (!buffers.has(key) && map.has(pitch)) {
      const bytes = Uint8Array.from(atob(map.get(pitch)), c => c.charCodeAt(0));
      buffers.set(key, audio.decodeAudioData(bytes.buffer).catch(() => null));
    }
    return buffers.get(key);
  }));
}

// One note of the instrument from `at` until `until`, on the audio clock.
function voice(buffer, at, until) {
  const piano = cfg.instrument === 'acoustic_grand_piano';
  const src = audio.createBufferSource(), gain = audio.createGain();
  src.buffer = buffer;
  gain.gain.setValueAtTime(piano ? .55 : .4, at);
  // a piano key lets go slowly, a bow or a breath stops at once
  gain.gain.setTargetAtTime(0, until, piano ? .12 : .04);
  src.connect(gain).connect(audio.destination);
  src.start(at);
  src.stop(until + (piano ? .8 : .3));
  return { src, gain };
}

// The sound of a note that was just changed, if the instrument is already there.
async function blip(pitch) {
  if (!audio || !sounds.has(cfg.instrument) || playing) return;
  try {
    await loadBuffers(cfg.instrument, [pitch]);
    const buffer = await buffers.get(cfg.instrument + pitch);
    if (buffer) voice(buffer, audio.currentTime, audio.currentTime + .45);
  } catch {}
}

const now = () => playing ? Math.max(0, playing.from + (audio.currentTime - playing.t0) * 1000 * playing.rate) : position;

// Colours every note for the moment `at`: sounding, played, played again in a repeat, or not yet.
// A note that comes twice shows how far it has got: purple only once its second time is over.
function paint(at = now()) {
  const state = new Map();   // id -> 'playing' | 'played' | 'played2'
  for (const e of events) {
    if (e.time > at) break;
    if (e.end > at) state.set(e.id, 'playing');
    else if (state.get(e.id) !== 'playing') state.set(e.id, e.pass > 1 ? 'played2' : 'played');
  }
  const idle = !playing && at <= 0;
  for (const el of $('pages').querySelectorAll('.playing, .played, .played2')) {
    if (idle || !state.has(el.id)) el.classList.remove('playing', 'played', 'played2');
  }
  if (!idle) for (const [id, cls] of state) {
    const el = document.getElementById(id);
    if (el && !el.classList.contains(cls)) { el.classList.remove('playing', 'played', 'played2'); el.classList.add(cls); }
  }
  placeCursor(at);
}

// Puts the playback line where the music is at the moment `at`: at a note when one starts,
// gliding to the next one in between. It stays on the page while playback is paused.
function placeCursor(at = now()) {
  const cursor = $('cursor');
  if (!cursor) return;
  if (!stops.length || (!playing && at <= 0 && !selected)) { cursor.hidden = true; return; }
  let k = 0;
  while (k + 1 < stops.length && stops[k + 1].time <= at) k++;
  const a = stops[k], b = stops[k + 1];
  const head = id => { const el = document.getElementById(id); return el && (el.querySelector('.notehead') || el).getBoundingClientRect(); };
  const system = document.getElementById(a.id)?.closest('.system');
  const ra = head(a.id);
  if (!ra || !system) { cursor.hidden = true; return; }
  const box = system.getBoundingClientRect(), view = $('pages').getBoundingClientRect();
  const until = b ? b.time : total, share = until > a.time ? Math.min(1, Math.max(0, (at - a.time) / (until - a.time))) : 0;
  // towards the next note if it is in the same system, otherwise towards the end of this one
  const rb = b && document.getElementById(b.id)?.closest('.system') === system ? head(b.id) : null;
  const to = rb && rb.left > ra.left ? rb.left : box.right;
  cursor.hidden = false;
  cursor.style.left = (ra.left + (to - ra.left) * share - view.left + $('pages').scrollLeft) + 'px';
  cursor.style.top = (box.top - view.top + $('pages').scrollTop - 6) + 'px';
  cursor.style.height = (box.height + 12) + 'px';
  cursor.firstElementChild.textContent = a.pass > 1 ? a.pass + '×' : '';
  // keep the system that is sounding on screen
  if (playing && (box.bottom > view.bottom - 10 || box.top < view.top)) {
    $('pages').scrollBy({ top: box.top - view.top - 60, behavior: 'smooth' });
  }
}

// Stops the sound. Paused, the line and the colours stay where they are; stopped, they go.
function stopPlaying(pause) {
  if (playing) {
    cancelAnimationFrame(playing.frame);
    position = Math.min(total, now());
    for (const v of playing.voices) { try { v.gain.gain.cancelScheduledValues(0); v.gain.gain.setTargetAtTime(0, audio.currentTime, .02); v.src.stop(audio.currentTime + .15); } catch {} }
    playing = null;
  }
  if (!pause) position = 0;
  $('play').textContent = t('play');
  paint();
}

async function play() {
  if (playing) { stopPlaying(true); return; }
  if (!events.length) return;
  audio ||= new AudioContext();
  await audio.resume();
  const instrument = cfg.instrument;
  try {
    if (!sounds.has(instrument)) say('loadingSound', t(instrument === 'acoustic_grand_piano' ? 'piano' : instrument));
    await loadBuffers(instrument, new Set(events.map(e => e.pitch)));
    if (status.key === 'loadingSound') sayShown();
  } catch (err) {
    console.error(err);
    say('soundFailed', '', true);
    return;
  }
  if (playing) return;
  if (position >= total) position = 0;
  const rate = cfg.tempo / 100, t0 = audio.currentTime + .08, from = position;
  const voices = [];
  for (const e of events) {
    if (e.time < from - 1) continue;
    const buffer = await buffers.get(instrument + e.pitch);
    if (buffer) voices.push(voice(buffer, t0 + (e.time - from) / 1000 / rate, t0 + (e.end - from) / 1000 / rate));
  }
  playing = { t0, from, rate, voices, frame: 0 };
  $('play').textContent = t('pause');
  const tick = () => {
    if (!playing) return;
    const at = now();
    if (at > total + 300) { stopPlaying(); return; }
    paint(at);
    playing.frame = requestAnimationFrame(tick);
  };
  playing.frame = requestAnimationFrame(tick);
}

// ---------- export ----------

const scripts = new Map();
function loadScript(src) {
  if (!scripts.has(src)) scripts.set(src, new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => { scripts.delete(src); rej(new Error('could not load ' + src)); };
    document.head.append(s);
  }));
  return scripts.get(src);
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

let cjkFont = null;

// The engraved pages as a vector PDF: Verovio's SVG is drawn into the PDF, not rasterised.
async function makePdf() {
  await Promise.all([loadScript(PDFKIT), loadScript(SVG2PDF)]);
  const [w, h] = PAPERS[cfg.paper].map(mm => mm * 72 / 25.4);
  const doc = new PDFDocument({ autoFirstPage: false, compress: true, info: { Title: heading().title || name } });
  const chunks = [];
  doc.on('data', c => chunks.push(c));
  const ended = new Promise(res => doc.on('end', res));
  const pages = [];
  for (let i = 1; i <= tk.getPageCount(); i++) pages.push(tk.renderToSVG(i));

  // Music signs inside text (the note of a tempo mark) are set in the music font, which Verovio
  // carries inside its SVG. The PDF library does not draw that font as text, so the outlines of
  // these signs are taken from the font and drawn as shapes.
  let music = null, musicName = '';
  const face = /font-family:\s*'([^']+)';\s*src:\s*url\(data:application\/font-woff2;charset=utf-8;base64,([^)]+)\)/.exec(pages[0]);
  if (face) {
    try {
      doc.registerFont(face[1], Uint8Array.from(atob(face[2]), c => c.charCodeAt(0)).buffer);
      doc.font(face[1]);
      music = doc._font.font; musicName = face[1];
      doc.font('Times-Roman');
    } catch (err) { console.error(err); music = null; }
  }
  const outline = page => {
    for (const span of page.querySelectorAll('tspan[font-family]')) {
      if (!music || !span.getAttribute('font-family').includes(musicName) || !span.textContent.trim()) continue;
      const k = parseFloat(span.getAttribute('font-size')) / music.unitsPerEm;
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      let { x, y } = span.getStartPositionOfChar(0);
      for (const ch of span.textContent) {
        const glyph = music.glyphForCodePoint(ch.codePointAt(0));
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', glyph.path.toSVG());
        path.setAttribute('transform', `translate(${x}, ${y}) scale(${k}, ${-k})`);
        path.setAttribute('style', 'stroke: none');
        group.append(path);
        x += glyph.advanceWidth * k;
      }
      span.closest('text').after(group);
    }
  };
  // Words outside Latin script need a font that has them.
  let words = '';
  const text = pages.join('').replace(/<style[\s\S]*?<\/style>/g, '').replace(/<[^>]+>/g, '');
  if (/[\u0370-\u1fff\u2e80-\ud7ff\uf900-\uffef]/.test(text)) {
    try {
      cjkFont ||= fetch(CJK_FONT).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
      doc.registerFont('Words', await cjkFont);
      words = 'Words';
    } catch (err) { console.error(err); cjkFont = null; }
  }
  const fontCallback = (family, bold, italic) => {
    if (music && family.includes(musicName)) return musicName;
    if (words) return words;
    return bold && italic ? 'Times-BoldItalic' : bold ? 'Times-Bold' : italic ? 'Times-Italic' : 'Times-Roman';
  };
  // Verovio's SVG leans on its own style sheet (what is hidden, what is stroked): each page is
  // put into the document, out of sight, so that the PDF is drawn from the styles in force.
  const bench = document.createElement('div');
  bench.style.cssText = 'position: fixed; left: -100000px; top: 0; width: 2100px; color: #000';
  document.body.append(bench);
  try {
    for (const svg of pages) {
      bench.innerHTML = svg;
      try { outline(bench); } catch (err) { console.error(err); }
      doc.addPage({ size: [w, h], margin: 0 });
      SVGtoPDF(doc, bench.firstElementChild, 0, 0, { width: w, height: h, preserveAspectRatio: 'xMinYMin meet', useCSS: true, fontCallback });
    }
  } finally { bench.remove(); }
  doc.end();
  await ended;
  return new Blob(chunks, { type: 'application/pdf' });
}

async function withPdf(use) {
  if (!shown || $('stage').classList.contains('busy')) return;
  busy(t('makingPdf'));
  try { await use(await makePdf()); }
  catch (err) { console.error(err); toast(t('pdfFailed') + (err?.message || err), true); }
  busy('');
}

const savePdf = () => withPdf(blob => download(blob, name + '.pdf'));

// Straight to the print dialog: the PDF is loaded into a hidden frame, whose viewer prints it.
let printUrl = '';
const printPdf = () => withPdf(blob => new Promise(done => {
  $('printFrame')?.remove();
  if (printUrl) URL.revokeObjectURL(printUrl);
  const url = printUrl = URL.createObjectURL(blob);
  const frame = document.createElement('iframe');
  frame.id = 'printFrame';
  frame.onload = () => setTimeout(() => {
    try { frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch (err) { console.error(err); window.open(url, '_blank'); toast(t('printOpened'), true); }
    done();
  }, 400);
  frame.src = url;
  document.body.append(frame);
}));

function saveSource() {
  if (!shown) return;
  const ext = isMusicXml(score) ? 'musicxml' : isXml(score) ? 'mei' : 'abc';
  // MusicXML is saved as engraved, with its beams, names and tempo
  download(new Blob([isMusicXml(score) ? pretty(prepare(score)) : score], { type: 'text/plain' }), `${name}.${ext}`);
}

function saveMidi() {
  if (!shown) return;
  const bytes = Uint8Array.from(atob(tk.renderToMIDI()), c => c.charCodeAt(0));
  download(new Blob([bytes], { type: 'audio/midi' }), name + '.mid');
}

// ---------- settings and events ----------

function showSettings() {
  $('instrument').value = cfg.instrument;
  $('tempo').value = cfg.tempo; $('tempoValue').textContent = cfg.tempo + '%';
  $('paper').value = cfg.paper;
  $('size').value = cfg.size; $('sizeValue').textContent = cfg.size + '%';
  $('lines').checked = cfg.lines;
}
function saveSettings() {
  try { localStorage.setItem('score-settings', JSON.stringify(cfg)); } catch {}
  showSettings();
}

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
  $('lang').textContent = t('other');
  dispatchEvent(new CustomEvent('score-lang', { detail: lang }));
  $('play').textContent = t(playing ? 'pause' : 'play');
  say(status.key, status.x, status.bad, status.tail, status.more);
  showPicked();
}

let typing = 0;
$('text').oninput = () => {
  clearTimeout(typing);
  typing = setTimeout(() => {
    score = $('text').value;
    if (engrave()) sayShown();
  }, 500);
};
const later = () => {
  clearTimeout(relayout);
  relayout = setTimeout(() => { if (shown && engrave()) sayShown(); }, 250);
};
$('title').oninput = $('subtitle').oninput = $('composer').oninput = $('bpm').oninput = later;
$('lines').onchange = e => { cfg.lines = e.target.checked; saveSettings(); later(); };
$('paper').onchange = e => { cfg.paper = e.target.value; saveSettings(); later(); };
$('size').oninput = e => { cfg.size = +e.target.value; saveSettings(); later(); };
$('tempo').oninput = e => {
  cfg.tempo = +e.target.value; saveSettings();
  if (playing) { stopPlaying(true); play(); }   // carry on at the new speed
};
$('instrument').onchange = e => {
  cfg.instrument = e.target.value; saveSettings();
  if (playing) { stopPlaying(true); play(); }
};
$('play').onclick = play;
$('stop').onclick = () => stopPlaying();
$('flat').onclick = () => change({ set: -1 });
$('natural').onclick = () => change({ set: 0 });
$('sharp').onclick = () => change({ set: 1 });
$('down2').onclick = () => change({ by: -2 });
$('down1').onclick = () => change({ by: -1 });
$('up1').onclick = () => change({ by: 1 });
$('up2').onclick = () => change({ by: 2 });
$('repStart').onclick = () => toggleRepeat('left');
$('repEnd').onclick = () => toggleRepeat('right');
// the metronome opens at the tempo the score is played at
$('metronome').onclick = () => { const bpm = +$('bpm').value; window.metro?.toggle(bpm ? bpm * cfg.tempo / 100 : 0); };
addEventListener('metro', e => $('metronome').classList.toggle('on', e.detail));
$('pdf').onclick = savePdf;
$('print').onclick = printPdf;
$('saveSource').onclick = saveSource;
$('midi').onclick = saveMidi;
$('showSource').onclick = () => showSource($('source').hidden);
$('tabPicture').onclick = () => showSource(true, 'picture');
$('tabText').onclick = () => showSource(true, 'text');
$('open').onclick = $('empty').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; };
$('lang').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('score-lang', lang); } catch {}
  applyLang();
};

// A click on a note picks it: playback is moved there, and the note can be changed.
$('pages').onclick = e => {
  const head = e.target.closest?.('.pgHead') && e.target.closest('tspan, text');
  if (head) {
    // the line that was clicked: the innermost piece of text may be only a part of it
    let line = head;
    while (line.parentElement?.closest('tspan') && !headKnown(line)) line = line.parentElement.closest('tspan');
    const field = headField(headKnown(line) ? line : head);
    editHead(field, field === 'composer' ? head.closest('text') : line);
    return;
  }
  const el = e.target.closest?.('.note');
  if (!el) return;
  const first = events.find(x => x.id === el.id);
  const wasPlaying = !!playing;
  stopPlaying(true);
  selected = el.id;
  if (first) position = first.time;
  showPicked();
  paint();
  if (wasPlaying) play();
};

const inField = () => /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || '');

addEventListener('paste', e => {
  if (inField()) return;
  const image = [...e.clipboardData.files].find(f => f.type.startsWith('image/'));
  const text = e.clipboardData.getData('text/plain');
  if (image) { e.preventDefault(); name = 'score'; recognise(image); }
  // score text pasted onto the page: MusicXML, MEI or ABC
  else if (/^\s*(<\?xml|<score-|<mei|X:\s*\d)/.test(text)) { e.preventDefault(); name = 'score'; forget(); setScore(text); }
  else toast(t('nothing'), true);
});

addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', () => document.body.classList.remove('dragging'));
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});

addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); savePdf(); }
  else if (mod && k === 'p' && shown) { e.preventDefault(); printPdf(); }
  else if (inField() || !shown) return;
  else if (mod && k === 'z') { e.preventDefault(); undo(); }
  else if (k === ' ' && !mod) { e.preventDefault(); play(); }
  else if ((k === 'arrowup' || k === 'arrowdown') && selected && !mod) {
    e.preventDefault();
    change({ by: (k === 'arrowup' ? 1 : -1) * (e.shiftKey ? 2 : 1) });
  }
});
new ResizeObserver(() => placeCursor()).observe($('stage'));

showSettings();
showSource(false);
applyLang();
engine.then(() => { if (status.key === 'engine') say('ready'); }, err => { console.error(err); say('engineFailed', '', true); });

// for trying things out from the console
window.scoreReader = {
  setScore, recognise, makePdf, readHeader, change, toggleRepeat, editHead, play,
  get events() { return events; }, get status() { return status; }, get position() { return now(); }, get score() { return score; },
};
</script>
<script type="module">
// The metronome and tuner: on its own, apart from the language and the tempo the score hands it.
const $ = id => document.getElementById('mt-' + id);
const panel = document.getElementById('metro');
const SVG = 'http://www.w3.org/2000/svg';

const TEXT = {
  en: {
    kMode: 'MODE', kBeat: 'BEAT', kRhythm: 'RHYTHM', kTap: 'TAP', start: 'START', stop: 'STOP', sound: 'SOUND', calib: 'CALIB',
    foot1: 'TURN THE DIAL', foot2: '30 – 252',
    metronome: 'METRONOME', tuner: 'TUNER',
    listen: 'Play or sing a note near the microphone.', noMic: 'The microphone could not be opened: the tuner needs it.',
    tone: 'Sounding {x}. Turn the dial for another note.',
    inTune: 'In tune', flat: 'Flat: tune up', sharp: 'Sharp: tune down',
  },
  zh: {
    kMode: '模式', kBeat: '拍数', kRhythm: '节奏型', kTap: '敲击', start: '开始', stop: '停止', sound: '标准音', calib: '校准',
    foot1: '转动旋钮', foot2: '30 – 252',
    metronome: 'METRONOME', tuner: 'TUNER',
    listen: '对着麦克风演奏或唱一个音。', noMic: '无法打开麦克风：调音器需要它。',
    tone: '正在发出 {x}。转动旋钮换一个音。',
    inTune: '准了', flat: '偏低：调高一点', sharp: '偏高：调低一点',
  },
};
// the language is the page's
let lang = document.documentElement.lang.startsWith('zh') ? 'zh' : 'en';
const t = (key, x = '') => TEXT[lang][key].replace('{x}', x);

// What the device is set to; remembered between visits.
const DEFAULTS = { bpm: 100, beats: 4, rhythm: 0, a4: 440 };
let cfg = { ...DEFAULTS };
try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('metronome-settings') || '{}') }; } catch {}

const RHYTHMS = [
  { sign: '♩', parts: [0] },                       // the beat alone
  { sign: '♫', parts: [0, 1 / 2] },                // eighths
  { sign: '♫³', parts: [0, 1 / 3, 2 / 3] },        // triplets
  { sign: '♬', parts: [0, 1 / 4, 2 / 4, 3 / 4] },  // sixteenths
];
const WORDS = [[40, 'GRAVE'], [52, 'LARGO'], [60, 'LARGHETTO'], [72, 'ADAGIO'], [88, 'ANDANTE'], [104, 'MODERATO'],
  [120, 'ALLEGRETTO'], [156, 'ALLEGRO'], [176, 'VIVACE'], [200, 'PRESTO'], [999, 'PRESTISSIMO']];
const NOTES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];

let mode = 'metronome';   // or 'tuner'
let audio = null;
let message = { key: '', x: '' };

function say(key, x = '') {
  message = { key, x };
  $('message').textContent = key ? t(key, x) : '';
}
function save() {
  try { localStorage.setItem('metronome-settings', JSON.stringify(cfg)); } catch {}
}

// ---------- the display ----------

// Seven-segment figures, as on a pocket device: every figure shows all its segments faintly,
// and the ones that make the number darkly.
const SEGMENTS = {
  a: 'M5 0h22l-4 5H9z', b: 'M29 2v22l-5-3V7z', c: 'M29 28v22l-5-5V31z', d: 'M5 52h22l-4-5H9z',
  e: 'M3 28v22l5-5V31z', f: 'M3 2v22l5-3V7z', g: 'M6 26l3-3h14l3 3-3 3H9z',
};
const FIGURES = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abfgcd', '-': 'g', ' ': '' };
function showFigures(text) {
  const g = $('digits');
  g.replaceChildren();
  [...text.padStart(3)].forEach((ch, i) => {
    for (const [name, d] of Object.entries(SEGMENTS)) {
      const p = document.createElementNS(SVG, 'path');
      p.setAttribute('d', d);
      p.setAttribute('transform', `translate(${i * 26}, 0) scale(.68) skewX(-6)`);
      p.setAttribute('class', (FIGURES[ch] || '').includes(name) ? 'ink' : 'ghost');
      g.append(p);
    }
  });
}

// The arc of ticks: every fifth one long.
function drawScale() {
  const g = $('scale');
  for (let i = -25; i <= 25; i++) {
    const a = i * 1.8 * Math.PI / 180, long = i % 5 === 0, r1 = 110, r2 = long ? 98 : 104;
    const p = document.createElementNS(SVG, 'path');
    p.setAttribute('d', `M${170 + r1 * Math.sin(a)} ${150 - r1 * Math.cos(a)} L${170 + r2 * Math.sin(a)} ${150 - r2 * Math.cos(a)}`);
    p.setAttribute('stroke', '#1c2619'); p.setAttribute('stroke-width', i === 0 ? 2.6 : long ? 1.6 : .8);
    g.append(p);
  }
}
// the needle, from -1 (far left) to 1 (far right)
function needle(x) {
  $('needle').setAttribute('transform', `rotate(${Math.max(-1, Math.min(1, x)) * 45} 170 150)`);
}

// One mark for every beat of the bar; the beat that is sounding is filled.
function showBeats(current) {
  const g = $('beats');
  g.replaceChildren();
  for (let i = 0; i < (mode === 'metronome' ? cfg.beats : 0); i++) {
    const r = document.createElementNS(SVG, 'rect');
    r.setAttribute('x', i * 13); r.setAttribute('y', 0); r.setAttribute('width', 10); r.setAttribute('height', i === 0 ? 8 : 5);
    r.setAttribute('class', i === current ? 'ink' : 'ghost');
    if (i !== current) r.style.opacity = .28;
    g.append(r);
  }
}

function lamps(left, mid, right) {
  $('lampLeft').classList.toggle('lit', !!left);
  $('lampMid').classList.toggle('lit', !!mid);
  $('lampRight').classList.toggle('lit', !!right);
}

function show() {
  $('lcdMode').textContent = t(mode);
  if (mode === 'metronome') {
    showFigures(String(cfg.bpm));
    $('lcdNote').textContent = '';
    $('lcdRight').textContent = `BEAT ${cfg.beats || '–'}   ${RHYTHMS[cfg.rhythm].sign}`;
    $('lcdWord').textContent = WORDS.find(w => cfg.bpm < w[0])[1];
    $('lcdSmall').textContent = '♩ =';
    if (!running) { needle(0); showBeats(-1); lamps(); }
  } else {
    $('lcdRight').textContent = `A4 = ${cfg.a4} Hz`;
    showBeats(-1);
    if (tone) { showFigures('   '); $('lcdNote').textContent = NOTES[toneNote % 12] + (Math.floor(toneNote / 12) - 1); $('lcdWord').textContent = toneHz().toFixed(1) + ' Hz'; $('lcdSmall').textContent = 'SOUND'; needle(0); lamps(0, 1, 0); }
  }
  $('start').textContent = t(mode === 'metronome' ? (running ? 'stop' : 'start') : 'sound');
  $('start').classList.toggle('running', mode === 'metronome' ? running : !!tone);
  $('beat').textContent = mode === 'metronome' ? t('kBeat') : t('calib') + ' −';
  $('rhythm').textContent = mode === 'metronome' ? t('kRhythm') : t('calib') + ' +';
  $('tap').textContent = mode === 'metronome' ? t('kTap') : 'A4';
  $('dial').style.transform = `rotate(${mode === 'metronome' ? (cfg.bpm - 30) * 6 : toneNote * 30}deg)`;
}

// ---------- the metronome ----------

let running = false, timer = 0, frame = 0;
let nextBeat = 0;        // audio time of the next beat
let count = 0;           // which beat of the bar that is
let shownBeats = [];     // beats already scheduled, for the display: { time, index, length }

// The tick of a quartz metronome: a short sine that dies away. Higher on the first beat of the bar.
function tick(at, kind) {
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.frequency.value = kind === 'bar' ? 1760 : kind === 'beat' ? 1175 : 880;
  gain.gain.setValueAtTime(kind === 'part' ? .16 : .5, at);
  gain.gain.exponentialRampToValueAtTime(.0008, at + (kind === 'part' ? .03 : .055));
  osc.connect(gain).connect(audio.destination);
  osc.start(at); osc.stop(at + .08);
}

// Beats are put on the audio clock a little ahead of time, so they stay exact whatever the page is doing.
function schedule() {
  while (nextBeat < audio.currentTime + .12) {
    const length = 60 / cfg.bpm;
    const bar = cfg.beats > 0 && count === 0;
    for (const part of RHYTHMS[cfg.rhythm].parts) tick(nextBeat + part * length, part ? 'part' : bar ? 'bar' : 'beat');
    shownBeats.push({ time: nextBeat, index: count, length });
    nextBeat += length;
    count = cfg.beats > 0 ? (count + 1) % cfg.beats : 0;
  }
}

// The needle swings like a pendulum: at one end on every beat.
function animate() {
  if (!running) return;
  const now = audio.currentTime;
  while (shownBeats.length > 1 && shownBeats[1].time <= now) shownBeats.shift();
  const b = shownBeats[0];
  if (b && b.time <= now) {
    const phase = Math.min(1, (now - b.time) / b.length), side = b.swing ??= (animate.side = -(animate.side || 1));
    needle(side * Math.cos(phase * Math.PI));
    showBeats(b.index);
    const flash = now - b.time < .09;
    const first = cfg.beats > 0 && b.index === 0;
    lamps(flash && first, flash && !first, flash && first);
  }
  frame = requestAnimationFrame(animate);
}

async function start() {
  audio ||= new AudioContext();
  await audio.resume();
  running = true;
  count = 0; shownBeats = [];
  nextBeat = audio.currentTime + .08;
  schedule();
  timer = setInterval(schedule, 25);
  frame = requestAnimationFrame(animate);
  show();
}
function stop() {
  running = false;
  clearInterval(timer);
  cancelAnimationFrame(frame);
  show();
}

function setBpm(v) {
  cfg.bpm = Math.max(30, Math.min(252, Math.round(v)));
  save(); show();
}

// The tempo of the last few taps.
let taps = [];
function tap() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 6) taps.shift();
  if (taps.length > 1) setBpm(60000 * (taps.length - 1) / (now - taps[0]));
}

// ---------- the tuner ----------

let mic = null;          // { stream, analyser, data }
let tunerFrame = 0;
let tone = null;         // the reference tone, while it sounds: { osc, gain }
let toneNote = 69;       // which note the reference tone is, as a MIDI number (A4)
let steady = 0;          // the cents shown, smoothed
const toneHz = () => cfg.a4 * 2 ** ((toneNote - 69) / 12);

// The pitch of a stretch of sound, by autocorrelation: the lag at which the wave best matches
// itself is its period. Returns 0 when there is no clear pitch.
function pitchOf(data, rate) {
  let energy = 0;
  for (const v of data) energy += v * v;
  if (energy / data.length < 2e-4) return 0;   // too quiet
  const n = data.length >> 1, min = Math.floor(rate / 2100), max = Math.min(n - 1, Math.floor(rate / 50));
  // the normalised square difference of the wave and itself shifted by `lag` (as in the YIN method)
  const diff = new Float32Array(max + 2), raw = new Float32Array(max + 2);
  let sum = 0, best = 0;
  for (let lag = 1; lag <= max + 1; lag++) {
    let d = 0;
    for (let i = 0; i < n; i++) { const x = data[i] - data[i + lag]; d += x * x; }
    sum += d;
    raw[lag] = d;
    diff[lag] = sum ? d * lag / sum : 1;
  }
  for (let lag = min; lag <= max; lag++) {
    if (diff[lag] < .12) {
      // the lowest point of this dip: the first one deep enough is the period, later ones its multiples
      for (best = lag; lag <= max && diff[lag] < .12; lag++) if (raw[lag] < raw[best]) best = lag;
      break;
    }
  }
  if (!best) return 0;
  // between the samples: the low point of the parabola through the three values around it
  const a = raw[best - 1], b = raw[best], c = raw[best + 1], shift = a + c - 2 * b ? (a - c) / (2 * (a + c - 2 * b)) : 0;
  return rate / (best + shift);
}

function listen() {
  if (mode !== 'tuner') return;
  tunerFrame = requestAnimationFrame(listen);
  if (!mic || tone) return;
  mic.analyser.getFloatTimeDomainData(mic.data);
  const hz = pitchOf(mic.data, audio.sampleRate);
  if (!hz) {
    if (performance.now() - listen.heard > 900) { showFigures('---'); $('lcdNote').textContent = ''; $('lcdWord').textContent = ''; $('lcdSmall').textContent = ''; needle(0); lamps(); say('listen'); }
    return;
  }
  listen.heard = performance.now();
  const exact = 69 + 12 * Math.log2(hz / cfg.a4), note = Math.round(exact), cents = (exact - note) * 100;
  // a new note jumps, the same note settles
  steady = note === listen.note ? steady + (cents - steady) * .25 : cents;
  listen.note = note;
  const shown = Math.round(steady);
  showFigures((shown < 0 ? '-' : ' ') + String(Math.abs(shown)).padStart(2));
  $('lcdNote').textContent = NOTES[((note % 12) + 12) % 12] + (Math.floor(note / 12) - 1);
  $('lcdWord').textContent = hz.toFixed(1) + ' Hz';
  $('lcdSmall').textContent = 'CENT';
  needle(steady / 50);
  const ok = Math.abs(steady) <= 4;
  lamps(!ok && steady < 0, ok, !ok && steady > 0);
  say(ok ? 'inTune' : steady < 0 ? 'flat' : 'sharp');
}

async function openMic() {
  if (mic) return;
  try {
    audio ||= new AudioContext();
    await audio.resume();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const analyser = audio.createAnalyser();
    analyser.fftSize = 4096;
    audio.createMediaStreamSource(stream).connect(analyser);
    mic = { stream, analyser, data: new Float32Array(analyser.fftSize) };
    say('listen');
  } catch (err) {
    console.error(err);
    say('noMic');
  }
}
function closeMic() {
  if (!mic) return;
  for (const track of mic.stream.getTracks()) track.stop();
  mic = null;
}

// The reference tone: a steady note to tune to by ear.
async function toggleTone() {
  if (tone) {
    tone.gain.gain.setTargetAtTime(0, audio.currentTime, .03);
    tone.osc.stop(audio.currentTime + .2);
    tone = null;
    say(mic ? 'listen' : 'noMic');
  } else {
    audio ||= new AudioContext();
    await audio.resume();
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = 'triangle';
    osc.frequency.value = toneHz();
    gain.gain.setValueAtTime(0, audio.currentTime);
    gain.gain.setTargetAtTime(.25, audio.currentTime, .03);
    osc.connect(gain).connect(audio.destination);
    osc.start();
    tone = { osc, gain };
    say('tone', NOTES[toneNote % 12] + (Math.floor(toneNote / 12) - 1));
  }
  show();
}
function setTone(note) {
  toneNote = Math.max(36, Math.min(96, note));
  if (tone) { tone.osc.frequency.setTargetAtTime(toneHz(), audio.currentTime, .01); say('tone', NOTES[toneNote % 12] + (Math.floor(toneNote / 12) - 1)); }
  show();
}
function setA4(v) {
  cfg.a4 = Math.max(410, Math.min(480, v));
  save();
  if (tone) tone.osc.frequency.setTargetAtTime(toneHz(), audio.currentTime, .01);
  show();
}

function setMode(next) {
  if (next === mode) return;
  if (mode === 'metronome' && running) stop();
  if (mode === 'tuner') { if (tone) toggleTone(); cancelAnimationFrame(tunerFrame); closeMic(); }
  mode = next;
  lamps(); needle(0); say('');
  if (mode === 'tuner') { showFigures('---'); $('lcdWord').textContent = $('lcdSmall').textContent = $('lcdNote').textContent = ''; openMic(); listen.heard = 0; tunerFrame = requestAnimationFrame(listen); }
  show();
}

// ---------- the keys and the dial ----------

$('start').onclick = () => mode === 'metronome' ? (running ? stop() : start()) : toggleTone();
$('mode').onclick = () => setMode(mode === 'metronome' ? 'tuner' : 'metronome');
$('beat').onclick = () => { if (mode === 'metronome') { cfg.beats = (cfg.beats + 1) % 8; count = 0; save(); show(); } else setA4(cfg.a4 - 1); };
$('rhythm').onclick = () => { if (mode === 'metronome') { cfg.rhythm = (cfg.rhythm + 1) % RHYTHMS.length; save(); show(); } else setA4(cfg.a4 + 1); };
$('minus').onclick = () => mode === 'metronome' ? setBpm(cfg.bpm - 1) : setTone(toneNote - 1);
$('plus').onclick = () => mode === 'metronome' ? setBpm(cfg.bpm + 1) : setTone(toneNote + 1);
$('tap').onclick = () => mode === 'metronome' ? tap() : (setA4(440), setTone(69));

// Turning the dial: six degrees to a beat per minute, thirty to a semitone.
let grip = null;
const angle = e => { const r = $('dial').getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
$('dial').onpointerdown = e => { $('dial').setPointerCapture(e.pointerId); grip = { last: angle(e), turned: 0, bpm: cfg.bpm, note: toneNote }; };
$('dial').onpointermove = e => {
  if (!grip) return;
  let d = angle(e) - grip.last;
  if (d > 180) d -= 360; else if (d < -180) d += 360;
  grip.last += d; grip.turned += d;
  if (mode === 'metronome') setBpm(grip.bpm + grip.turned / 6); else setTone(grip.note + Math.round(grip.turned / 30));
};
$('dial').onpointerup = $('dial').onpointercancel = () => { grip = null; };
$('dial').onwheel = e => { e.preventDefault(); const d = e.deltaY < 0 ? 1 : -1; if (mode === 'metronome') setBpm(cfg.bpm + d); else setTone(toneNote + d); };

// The keys work while the device has the focus (after a click on it): elsewhere they are the score's.
panel.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  e.stopPropagation();
  const k = e.key.toLowerCase(), step = e.shiftKey ? 10 : 1;
  const press = id => { $(id).classList.add('down'); setTimeout(() => $(id).classList.remove('down'), 90); $(id).click(); };
  if (k === ' ') { e.preventDefault(); press('start'); }
  else if (k === 'arrowup' || k === 'arrowright') { e.preventDefault(); if (mode === 'metronome') setBpm(cfg.bpm + step); else setTone(toneNote + 1); }
  else if (k === 'arrowdown' || k === 'arrowleft') { e.preventDefault(); if (mode === 'metronome') setBpm(cfg.bpm - step); else setTone(toneNote - 1); }
  else if (k === 't') press('tap');
  else if (k === 'm') press('mode');
  else if (k === 'b') press('beat');
  else if (k === 'r') press('rhythm');
});

function applyLang() {
  for (const el of panel.querySelectorAll('[data-mt]')) el.textContent = t(el.dataset.mt);
  say(message.key, message.x);
  show();
}
addEventListener('score-lang', e => { lang = e.detail; applyLang(); });

// The device can be moved about by its case.
let held = null;
panel.addEventListener('pointerdown', e => {
  if (e.target.closest('button, #mt-dial')) return;
  const r = panel.getBoundingClientRect();
  held = { x: e.clientX - r.left, y: e.clientY - r.top };
  panel.setPointerCapture(e.pointerId);
});
panel.addEventListener('pointermove', e => {
  if (!held) return;
  const r = panel.getBoundingClientRect();
  panel.style.left = Math.max(8 - r.width / 2, Math.min(innerWidth - r.width / 2, e.clientX - held.x)) + 'px';
  panel.style.top = Math.max(0, Math.min(innerHeight - 60, e.clientY - held.y)) + 'px';
  panel.style.bottom = 'auto';
});
panel.addEventListener('pointerup', () => { held = null; });
panel.addEventListener('pointercancel', () => { held = null; });

function close() {
  setMode('metronome');
  if (running) stop();
  panel.hidden = true;
  dispatchEvent(new CustomEvent('metro', { detail: false }));
}
$('close').onclick = close;

// What the score's page calls: shown at the tempo of the score, when it has one.
window.metro = {
  toggle(bpm) {
    if (!panel.hidden) { close(); return; }
    if (bpm) setBpm(bpm);
    panel.hidden = false;
    panel.focus({ preventScroll: true });
    dispatchEvent(new CustomEvent('metro', { detail: true }));
  },
};

drawScale();
applyLang();
</script>
</body>
</html>
