<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Unlisted personal tool: not linked from the homepage, not in the sitemap. -->
<meta name="robots" content="noindex, nofollow">
<title>Score Reader</title>
<link rel="icon" href="icon.svg">
<!-- Light by day, dark by night, with the homepage's own logic and toggle. -->
<script src="../tz-coords.js"></script>
<script src="../theme.js"></script>
<style>
  /* Colours follow the homepage: light by default, dark when ../theme.js sets data-theme="dark". */
  :root {
    color-scheme: light;
    --bg: #e8eaed; --panel: #ffffff; --line: #d4d4d4; --text: #000000; --muted: #666666;
    --accent: #1772d0; --on-accent: #ffffff; --btn: #f2f2f2; --btn-hover: #e6e6e6; --bad: #c62828;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #101216; --panel: #15181d; --line: #363b44; --text: #e4e6ea; --muted: #99a2ad;
    --accent: #6ab0f3; --on-accent: #0d1117; --btn: #23272e; --btn-hover: #2c313a; --bad: #ff8080;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  button, a.button {
    font: inherit; color: var(--text); background: var(--btn);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer;
    text-decoration: none; text-align: center;
  }
  button:hover:not(:disabled), a.button:hover { background: var(--btn-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.12); }
  button.on, button.on:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  /* the same Home pill as on the project pages */
  .home-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px;
    background: var(--btn); border: 1px solid var(--line); color: var(--text);
    font-weight: 600; text-decoration: none;
  }
  .home-link:hover { background: var(--btn-hover); }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
  }
  .theme-toggle svg { display: block; width: 15px; height: 15px; }
  .theme-toggle .icon-sun, [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  .seg { display: flex; }
  .seg button { flex: 1; border-radius: 0; padding: 4px 8px; }
  .seg button + button { border-left: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }

  main { flex: 1; display: flex; min-height: 0; }

  /* left: what the score was made from, the picture and the text */
  #source {
    width: 34%; min-width: 260px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  #source[hidden] { display: none; }
  #source .seg { padding: 8px; }
  #picture { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 8px; }
  #picture img { display: block; width: 100%; background: #fff; }
  #picture[hidden], #text[hidden] { display: none; }
  #text {
    flex: 1; min-height: 0; margin: 0 8px 8px; padding: 8px; resize: none;
    font: 12px/1.45 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    white-space: pre; user-select: text;
  }

  #stage { flex: 1; position: relative; min-width: 0; }
  #pages { position: absolute; inset: 0; overflow: auto; padding: 20px; }
  #pages .page {
    position: relative; max-width: 900px; margin: 0 auto 20px; background: #fff; color: #000;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
  }
  #pages .page svg { display: block; width: 100%; height: auto; }
  /* the whole box of a note takes the click: the inside of a half note is empty */
  #pages .note { cursor: pointer; pointer-events: bounding-box; }
  /* Played once: blue. Played again in a repeat: purple. Sounding now: red. Picked for editing: green. */
  #pages .played, #pages .played * { fill: #2f7fd0; stroke: #2f7fd0; }
  #pages .played2, #pages .played2 * { fill: #8a4fc7; stroke: #8a4fc7; }
  #pages .selected, #pages .selected * { fill: #0e9a55; stroke: #0e9a55; }
  #pages .playing, #pages .playing * { fill: #d5382a; stroke: #d5382a; }
  /* Title, subtitle and names are edited where they stand: a click on one opens a field over it. */
  #pages .pgHead text { cursor: text; pointer-events: bounding-box; }
  #pages .pgHead text:hover { fill: #1772d0; }
  #headAdd { position: absolute; left: 1.5%; top: 1%; display: flex; gap: 6px; }
  #headAdd button {
    padding: 1px 8px; border: 1px dashed #b5b5b5; border-radius: 10px; background: none; color: #8a8a8a; font-size: 12px;
  }
  #headAdd button:hover { background: #eef4fb; border-color: #1772d0; color: #1772d0; }
  #headEdit {
    position: absolute; z-index: 5; margin: 0; padding: 2px 6px; border: 1.5px solid #1772d0; border-radius: 4px; outline: 0;
    background: #fff; color: #000; font-family: "Times New Roman", "Noto Serif CJK SC", serif; line-height: 1.25;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .2); resize: none; user-select: text;
  }
  /* the line that shows where playback is */
  #cursor {
    position: absolute; width: 2px; margin-left: -1px; border-radius: 1px;
    background: #d5382a; box-shadow: 0 0 0 1px rgba(213, 56, 42, .18); pointer-events: none;
  }
  #cursor[hidden] { display: none; }
  /* above the line during a repeat: which time through */
  #cursor b {
    position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    padding: 0 5px; border-radius: 8px; background: #8a4fc7; color: #fff; font: 600 11px/16px system-ui, sans-serif;
  }
  #cursor b:empty { display: none; }
  #stage.busy #pages { opacity: .4; }
  #busy {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 8px 16px; border-radius: 8px; background: rgba(0, 0, 0, .72); color: #fff; text-align: center;
  }
  #stage:not(.busy) #busy { display: none; }
  #empty {
    position: absolute; inset: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); cursor: pointer;
  }
  #empty[hidden] { display: none; }
  #empty b { font-size: 20px; font-weight: 600; color: var(--text); }
  body.dragging #stage { outline: 2px solid var(--accent); outline-offset: -2px; }

  aside {
    width: 300px; flex: none; display: flex; flex-direction: column; gap: 9px;
    padding: 14px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  }
  aside h2 { margin: 6px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  aside h2:first-child { margin-top: 0; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field > label { flex: 1; }
  input[type=text], input[type=number], select, aside textarea {
    font: inherit; color: var(--text); background: var(--btn);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
  }
  input[type=text], aside textarea { width: 100%; user-select: text; }
  aside textarea { resize: vertical; min-height: 3.6em; }
  input[type=number], select { width: 130px; }
  input[type=range] { width: 130px; accent-color: var(--accent); }
  .value { width: 44px; text-align: right; color: var(--muted); font-size: 13px; }
  aside .row { display: flex; gap: 8px; }
  aside .row button, aside .row a.button { flex: 1; padding: 7px 6px; }
  aside .row.keys { gap: 5px; }
  aside .row.keys button { padding: 5px 0; font-size: 15px; }
  #picked { min-height: 1.5em; font-size: 13px; flex-shrink: 0; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { margin: 0; }
  #status { min-height: 3em; font-size: 13px; }
  #status.bad { color: var(--bad); }
  #bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  #bar[hidden] { display: none; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .note-text { color: var(--muted); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .credit { margin-top: auto; padding-top: 8px; color: var(--muted); font-size: 12px; }
  .credit a { color: var(--accent); }
  /* holds the pages for the print dialog; it has to be in the page, but is never seen */
  #printFrame { position: fixed; right: 0; bottom: 0; width: 0; height: 0; border: 0; visibility: hidden; }

  /* ---------- the metronome and tuner: a device that floats over the score ---------- */
  #metro { position: fixed; left: 20px; bottom: 20px; z-index: 30; width: 400px; max-width: calc(100vw - 24px); touch-action: none; }
  #metro[hidden] { display: none; }
  #metro .device { cursor: move; }
  #metro #mt-close {
    position: absolute; top: 12px; right: 14px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    font: 700 14px/1 system-ui, sans-serif; color: #c9ced6; background: linear-gradient(180deg, #4a4e56, #2c2f34);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 2px 3px rgba(0, 0, 0, .6);
  }
  #metro #mt-close:hover { color: #fff; background: linear-gradient(180deg, #5d626b, #3f434a); }
  #metro #mt-message { min-height: 1.4em; margin-top: 10px; text-align: center; font-size: 11px; color: #8f96a1; }
  #metro .device {
    position: relative; width: 400px; max-width: 100%; padding: 18px 20px 20px;
    border-radius: 26px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, 0) 12%),
      linear-gradient(160deg, #3b3f46, #24272c 55%, #1a1c20);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 -3px 6px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(0, 0, 0, .5),
      0 2px 2px rgba(0, 0, 0, .3), 0 18px 34px rgba(0, 0, 0, .38), 0 40px 60px -20px rgba(0, 0, 0, .35);
    color: #c9ced6;
  }
  /* the speaker: rows of punched holes */
  #metro .grille {
    height: 26px; margin: 0 70px 12px; border-radius: 13px;
    background:
      radial-gradient(circle at 50% 42%, #08090a 0 1.5px, rgba(255, 255, 255, .1) 1.6px 2.1px, transparent 2.2px) 0 0 / 8px 8px,
      linear-gradient(180deg, #1c1e22, #2a2d32);
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .09);
  }
  /* the lamps over the display */
  #metro .lamps { display: flex; justify-content: center; gap: 26px; margin-bottom: 10px; }
  #metro .lamp {
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #5c2f2b, #2a1210 70%);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .12);
  }
  #metro .lamp.green { background: radial-gradient(circle at 35% 30%, #2f5a37, #102514 70%); }
  #metro .lamp.lit { background: radial-gradient(circle at 35% 30%, #ffd9cf, #ff4b2e 45%, #b51e08); box-shadow: 0 0 12px 3px rgba(255, 75, 46, .75), inset 0 1px 1px rgba(255, 255, 255, .6); }
  #metro .lamp.green.lit { background: radial-gradient(circle at 35% 30%, #e2ffe0, #3ee05a 45%, #129a2c); box-shadow: 0 0 12px 3px rgba(62, 224, 90, .7), inset 0 1px 1px rgba(255, 255, 255, .6); }

  /* the liquid crystal display, behind its window */
  #metro .window {
    padding: 9px; border-radius: 12px; background: linear-gradient(180deg, #0c0d0f, #1b1d21);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .9), 0 1px 0 rgba(255, 255, 255, .1);
  }
  #metro .lcd {
    position: relative; display: block; width: 100%; border-radius: 5px;
    background: linear-gradient(180deg, #aebb9b, #c3ceb0 45%, #b4c0a0);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .45), inset 0 0 22px rgba(60, 80, 40, .22);
  }
  #metro .lcd svg { display: block; width: 100%; height: auto; }
  /* the gloss of the window over the display */
  #metro .lcd::after {
    content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, .22) 0 18%, rgba(255, 255, 255, 0) 38%);
  }
  #metro .ink { fill: #1c2619; }
  #metro .ghost { fill: #1c2619; opacity: .07; }
  #metro .lcd text { fill: #1c2619; font-family: "DejaVu Sans Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 700; }
  #metro .lcd .off { opacity: .1; }

  #metro .plate {
    display: flex; justify-content: space-between; align-items: baseline; margin: 9px 4px 12px;
    font: 700 10px/1 system-ui, sans-serif; letter-spacing: .16em; color: #8f96a1; text-shadow: 0 1px 0 rgba(0, 0, 0, .7);
  }
  #metro .plate b { font-size: 12px; color: #c9ced6; letter-spacing: .22em; }

  #metro .controls { display: grid; grid-template-columns: 148px 1fr; gap: 16px; align-items: center; }

  /* the dial: turned to set the tempo */
  #metro .dial-well {
    position: relative; width: 148px; height: 148px; border-radius: 50%;
    background: radial-gradient(circle, #101113 60%, #26292e 61%, #17181b);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .85), 0 1px 0 rgba(255, 255, 255, .1);
  }
  #metro #mt-dial {
    position: absolute; inset: 9px; border-radius: 50%; cursor: grab; touch-action: none;
    /* a knurled rim */
    background: repeating-conic-gradient(#4a4e56 0deg 3deg, #25272b 3deg 6deg);
    box-shadow: 0 5px 9px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(0, 0, 0, .6);
  }
  #metro #mt-dial:active { cursor: grabbing; }
  #metro #mt-dial::before {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, #6a6f79, #3a3d44 45%, #25272c);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, .28), inset 0 -3px 5px rgba(0, 0, 0, .5), 0 0 0 1px rgba(0, 0, 0, .55);
  }
  /* the dimple a finger turns it by */
  #metro #mt-dial::after {
    content: ""; position: absolute; left: 50%; top: 20px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #17181b, #34373d);
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .16);
  }

  #metro .pad { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }
  /* rubber keys */
  #metro .key {
    position: relative; height: 38px; padding: 0; border: 0; border-radius: 9px; cursor: pointer;
    font: 700 10px/1 system-ui, "Noto Sans CJK SC", sans-serif; letter-spacing: .08em; color: #e3e6ea;
    background: linear-gradient(180deg, #5d626b, #3f434a);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -2px 2px rgba(0, 0, 0, .35), 0 3px 0 #15161a, 0 4px 5px rgba(0, 0, 0, .5);
    text-shadow: 0 -1px 0 rgba(0, 0, 0, .6);
    transition: transform .04s, box-shadow .04s;
  }
  #metro .key:active, #metro .key.down {
    transform: translateY(2px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), inset 0 -1px 2px rgba(0, 0, 0, .35), 0 1px 0 #15161a, 0 2px 3px rgba(0, 0, 0, .5);
  }
  #metro .key.wide { grid-column: span 3; height: 46px; font-size: 13px; letter-spacing: .14em; background: linear-gradient(180deg, #e8603f, #b93a1d); }
  #metro .key.wide.running { background: linear-gradient(180deg, #5d626b, #3f434a); }
  #metro .key.mode { background: linear-gradient(180deg, #4d7fb8, #2e5688); }

  #metro .feet { display: flex; justify-content: space-between; margin: 14px 6px 0; font: 600 9px/1 system-ui, sans-serif; letter-spacing: .14em; color: #6f7681; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 8px; background: #2f7d4f; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: #a13c3c; }
</style>
</head>
<body>
<header>
  <a class="home-link" href="../" title="Back to Chang Luo's homepage">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h5v-6h4v6h5v-9.5"/></svg>
    <span data-i18n="home"></span>
  </a>
  <button id="open" data-i18n="open"></button>
  <button id="showSource" data-i18n="showSource"></button>
  <span class="hint" data-i18n="hint"></span>
  <button id="lang"></button>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 1.6v2.6M12 19.8v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.6 12h2.6M19.8 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"></path></svg>
  </button>
</header>
<main>
  <section id="source" hidden>
    <div class="seg">
      <button id="tabPicture" data-i18n="tabPicture"></button>
      <button id="tabText" data-i18n="tabText"></button>
    </div>
    <div id="picture"><img id="original" alt=""></div>
    <textarea id="text" spellcheck="false" hidden></textarea>
  </section>
  <div id="stage">
    <div id="pages"></div>
    <div id="busy"></div>
    <div id="empty">
      <b data-i18n="emptyTitle"></b>
      <span data-i18n="emptySub"></span>
    </div>
  </div>
  <aside>
    <h2 data-i18n="statusTitle"></h2>
    <div id="status"></div>
    <div id="bar" hidden><i></i></div>

    <h2 data-i18n="playTitle"></h2>
    <div class="field">
      <label for="instrument" data-i18n="instrument"></label>
      <select id="instrument">
        <option value="acoustic_grand_piano" data-i18n="piano"></option>
        <option value="violin" data-i18n="violin"></option>
        <option value="flute" data-i18n="flute"></option>
      </select>
    </div>
    <div class="field">
      <label for="bpm" data-i18n="bpm"></label>
      <input type="number" id="bpm" min="20" max="300" step="1" data-i18n-placeholder="bpmHint">
    </div>
    <div class="field">
      <label for="tempo" data-i18n="tempo"></label>
      <input type="range" id="tempo" min="40" max="160" step="5"><span class="value" id="tempoValue"></span>
    </div>
    <div class="row">
      <button id="play" class="primary" disabled></button>
      <button id="stop" disabled data-i18n="stop"></button>
    </div>
    <div class="legend">
      <span><i style="background:#d5382a"></i><span data-i18n="legendNow"></span></span>
      <span><i style="background:#2f7fd0"></i><span data-i18n="legendPlayed"></span></span>
      <span><i style="background:#8a4fc7"></i><span data-i18n="legendAgain"></span></span>
    </div>
    <div class="row"><button id="metronome" data-i18n="metronome"></button></div>

    <h2 data-i18n="noteTitle"></h2>
    <div id="picked"></div>
    <div class="row keys">
      <button id="flat" disabled title="♭">♭</button>
      <button id="natural" disabled title="♮">♮</button>
      <button id="sharp" disabled title="♯">♯</button>
    </div>
    <div class="row keys">
      <button id="down2" disabled data-i18n="down2"></button>
      <button id="down1" disabled data-i18n="down1"></button>
      <button id="up1" disabled data-i18n="up1"></button>
      <button id="up2" disabled data-i18n="up2"></button>
    </div>
    <div class="note-text" data-i18n="noteHint"></div>
    <div class="row">
      <button id="repStart" disabled data-i18n="repStart"></button>
      <button id="repEnd" disabled data-i18n="repEnd"></button>
    </div>
    <div class="note-text" data-i18n="repHint"></div>

    <h2 data-i18n="layoutTitle"></h2>
    <input type="text" id="title" data-i18n-placeholder="titleHint">
    <input type="text" id="subtitle" data-i18n-placeholder="subtitleHint">
    <textarea id="composer" rows="2" data-i18n-placeholder="composerHint"></textarea>
    <div class="field">
      <label for="paper" data-i18n="paper"></label>
      <select id="paper">

// ---------- engraving ----------

const engine = (async () => {

    import(VEROVIO + 'verovio-module.mjs'), import(VEROVIO + 'verovio.mjs'),
  ]);

const isXml = text => /^\s*</.test(text);
const isMusicXml = text => isXml(text) && /<score-(partwise|timewise)[\s>]/.test(text);
const parse = text => new DOMParser().parseFromString(text, 'application/xml');
const escapeXml = v => v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Recognised scores come without beams, and jump between their voices note by note.
// Each measure is rewritten voice after voice, with every note at the time it had, and
// in each voice neighbouring eighths and shorter notes inside one beat are joined by a beam.
// A score that has beams of its own is left as it is.
function tidy(doc) {
  if (doc.querySelector('beam')) return;
  const SHORT = new Set(['eighth', '16th', '32nd', '64th', '128th']);
  const make = (tag, text) => { const el = doc.createElement(tag); if (text !== undefined) el.textContent = text; return el; };
  for (const part of doc.querySelectorAll('part')) {
    let divisions = 1, beats = 4, beatType = 4;
    for (const measure of part.children) {
      if (measure.tagName !== 'measure') continue;
      const before = [], after = [], voices = new Map();
      let at = 0, waiting = [], chordOf = null, lastVoice = null;
      for (const el of [...measure.children]) {
        const number = sel => +(el.querySelector(sel)?.textContent || 0);
        const tag = el.tagName;
        if (tag === 'attributes') {
          divisions = number('divisions') || divisions;
          if (el.querySelector('time')) { beats = number('time > beats') || 4; beatType = number('time > beat-type') || 4; }
        }
        if (tag === 'backup') at -= number('duration');
        else if (tag === 'forward') at += number('duration');
        else if (tag !== 'note') {
          // what stands ahead of the first note stays there; the rest travels with the next note
          if (lastVoice) waiting.push({ time: at, els: [el], length: 0 }); else before.push(el);
        } else if (el.querySelector('chord') && chordOf) chordOf.els.push(el);
        else {
          const key = (el.querySelector('voice')?.textContent || '1') + '/' + (el.querySelector('staff')?.textContent || '1');
          if (!voices.has(key)) voices.set(key, []);
          lastVoice = voices.get(key);
          lastVoice.push(...waiting);
          waiting = [];
          const length = el.querySelector('grace') ? 0 : number('duration');
          chordOf = {
            time: at, els: [el], length, note: el,
            short: length > 0 && !el.querySelector('rest') && SHORT.has(el.querySelector('type')?.textContent),
          };
          lastVoice.push(chordOf);
          at += length;
        }
      }
      // what is left over closes the measure: its bar line
      for (const item of waiting) after.push(...item.els);
      if (!lastVoice) continue;

      // a beat: the dotted quarter in 6/8, 9/8 and 12/8, otherwise the quarter
      const beat = beatType === 8 && beats % 3 === 0 && beats > 3 ? divisions * 1.5 : divisions;
      measure.replaceChildren(...before);
      let cursor = 0, end = 0;
      const move = to => {
        if (to === cursor) return;
        const el = make(to > cursor ? 'forward' : 'backup');
        el.append(make('duration', Math.abs(to - cursor)));
        measure.append(el);
        cursor = to;
      };
      for (const items of voices.values()) {
        let group = [];
        const close = () => {
          group.forEach((item, i) => {
            if (group.length < 2) return;
            const beam = make('beam', i === 0 ? 'begin' : i === group.length - 1 ? 'end' : 'continue');
            beam.setAttribute('number', '1');
            // the schema wants beams ahead of these
            item.note.insertBefore(beam, item.note.querySelector('notations, lyric, play, listen'));
          });
          group = [];
        };
        for (const item of items) {
          move(item.time);
          measure.append(...item.els);
          cursor += item.length;
          end = Math.max(end, cursor);
          if (!item.note || !item.length) continue;   // a dynamic or a grace note does not break a beam
          const first = group[0], last = group[group.length - 1];
          if (!item.short || (first && (Math.floor(first.time / beat) !== Math.floor(item.time / beat) || last.time + last.length !== item.time))) close();
          if (item.short) group.push(item);
        }
        close();
      }
      move(end);
      measure.append(...after);
    }
  }
}

// MusicXML laid out for reading and fixing by hand: the recogniser writes it on one line.
function pretty(text) {
  const doc = typeof text === 'string' ? parse(text) : text;
  if (doc.querySelector('parsererror')) return String(text);
  const lines = ['<?xml version="1.0" encoding="UTF-8"?>'];
  const write = (el, indent) => {
    const attrs = [...el.attributes].map(a => ` ${a.name}="${escapeXml(a.value).replace(/"/g, '&quot;')}"`).join('');
    const children = [...el.children], value = el.textContent.trim();
    if (!children.length) lines.push(indent + (value ? `<${el.tagName}${attrs}>${escapeXml(value)}</${el.tagName}>` : `<${el.tagName}${attrs}/>`));
    else {
      lines.push(`${indent}<${el.tagName}${attrs}>`);
      for (const child of children) write(child, indent + '  ');
      lines.push(`${indent}</${el.tagName}>`);
    }
  };
  write(doc.documentElement, '');
  return lines.join('\n') + '\n';
}

// What the recogniser adds that the picture did not have: the name it gives the part.
function fromPicture(xml) {
  const doc = parse(xml);
  if (doc.querySelector('parsererror')) return xml;
  for (const el of doc.querySelectorAll('part-name, part-abbreviation')) el.textContent = '';
  return pretty(doc);
}

const heading = () => ({
  title: $('title').value.trim(), subtitle: $('subtitle').value.trim(),
  composer: $('composer').value.split('\n').map(v => v.trim()).filter(Boolean),
});

// MusicXML as it is engraved: with beams, with a number on every note (the notes on the page
// get the same, so a click finds its note here), and with the tempo and names from the side panel.
// Other formats pass through.
function prepare(text) {
  if (!isMusicXml(text)) return text;
  const doc = parse(text);
  if (doc.querySelector('parsererror')) return text;   // Verovio will say what is wrong with it
  tidy(doc);
  doc.querySelectorAll('note').forEach((el, i) => el.setAttribute('id', 'n' + i));
  const root = doc.documentElement, { title, subtitle, composer } = heading();
  const make = (tag, value) => { const el = doc.createElement(tag); el.textContent = value; return el; };
  if (title || subtitle) {
    for (const el of root.querySelectorAll(':scope > work, :scope > movement-title')) el.remove();
    if (subtitle) root.prepend(make('movement-title', subtitle));
    if (title) { const work = doc.createElement('work'); work.append(make('work-title', title)); root.prepend(work); }
  }
  const identification = root.querySelector(':scope > identification');
  if (composer.length && identification) {
    for (const el of identification.querySelectorAll(':scope > creator')) el.remove();
    const creator = make('creator', composer.join(', '));
    creator.setAttribute('type', 'composer');
    identification.prepend(creator);
  }
  const bpm = +$('bpm').value, first = doc.querySelector('part > measure');
  if (bpm >= 20 && bpm <= 300 && first) {
    for (const el of first.querySelectorAll(':scope > direction')) if (el.querySelector('metronome')) el.remove();
    // the beat is the dotted quarter in 6/8, 9/8 and 12/8, otherwise the quarter
    const beats = +(first.querySelector('time > beats')?.textContent || 4), type = +(first.querySelector('time > beat-type')?.textContent || 4);
    const dotted = type === 8 && beats % 3 === 0 && beats > 3;
    const direction = doc.createElement('direction');
    direction.setAttribute('placement', 'above');
    direction.innerHTML = `<direction-type><metronome><beat-unit>quarter</beat-unit>${dotted ? '<beat-unit-dot/>' : ''}<per-minute>${bpm}</per-minute></metronome></direction-type><staff>1</staff><sound tempo="${dotted ? bpm * 1.5 : bpm}"/>`;
    const lead = [...first.children].filter(el => el.tagName === 'attributes' || el.tagName === 'print').pop();
    if (lead) lead.after(direction); else first.prepend(direction);
  }
  return new XMLSerializer().serializeToString(doc);
}

function options(ownHeader) {
  const [w, h] = PAPERS[cfg.paper];
  // Verovio lays out in tenths of a millimetre at scale 100, where a staff is 7.2 mm high;
  // a smaller scale on a page made larger by the same factor keeps the paper and shrinks the music.
  const f = 100 / cfg.size, margin = Math.round(MARGIN * 10 * f);
  return {
    pageWidth: Math.round(w * 10 * f), pageHeight: Math.round(h * 10 * f), scale: cfg.size,
    pageMarginLeft: margin, pageMarginRight: margin, pageMarginTop: margin, pageMarginBottom: margin,
    adjustPageHeight: false, footer: 'none', svgViewBox: true,
    header: ownHeader ? 'encoded' : 'auto',
    // 'line' keeps the systems of the original and still fills the pages itself
    breaks: cfg.lines && /<print\b[^>]*new-system="yes"|<sb[\s\/>]/.test(score) ? 'line' : 'auto',
  };
}

// Loads `score` into Verovio. The title, the subtitle and the composer from the side panel are set
// at the head of the first page the way printed music has them: title and subtitle in the middle,
// the composer below them on the right.
function load() {
  const { title, subtitle, composer } = heading(), own = !!(title || subtitle || composer.length);
  tk.setOptions(options(own));
  let ok = false;
  try { ok = tk.loadData(prepare(score)); } catch (err) { console.error(err); }
  if (!ok || !own) return ok;
  const middle = [title && `<rend fontsize="x-large">${escapeXml(title)}</rend>`, subtitle && `<rend fontsize="large">${escapeXml(subtitle)}</rend>`].filter(Boolean).join('<lb/>');
  const head = '<pgHead func="first">'
    + (middle ? `<rend halign="center" valign="top">${middle}</rend>` : '')
    + (composer.length ? `<rend halign="right" valign="bottom">${composer.map(escapeXml).join('<lb/>')}</rend>` : '')
    + '</pgHead>';
  const mei = tk.getMEI().replace(/<pgHead\b[\s\S]*?<\/pgHead>/g, '').replace(/(<scoreDef\b[^>]*>)/, '$1' + head);
  try { return tk.loadData(mei); } catch (err) { console.error(err); return false; }
}

// Engraves `score` and puts the pages on screen. Returns false if it is not a score.
function engrave() {
  const wasPlaying = !!playing;
  stopPlaying(true);
  if (!load() || !tk.getPageCount()) {
    // keep what was on the page: a slip while typing should not blank it
    say('badScore', '', true, (tk.getLog() || '').trim().split('\n').pop().slice(0, 200));
    return false;
  }
  const pages = $('pages');
  pages.replaceChildren();
  for (let i = 1; i <= tk.getPageCount(); i++) {
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = tk.renderToSVG(i);
    pages.append(page);
  }
  showHeadAdd();
  const cursor = document.createElement('div');
  cursor.id = 'cursor'; cursor.hidden = true;
  cursor.append(document.createElement('b'));
  pages.append(cursor);

  // What to play, from Verovio's own MIDI rendering. It writes repeats out: the second time
  // through, a note comes with "-rend2" after its id.
  tk.renderToMIDI();
  events = [];
  const open = new Map(), pitches = new Map();
  for (const entry of tk.renderToTimemap()) {
    for (const key of entry.off || []) {
      const e = open.get(key);
      if (e) { e.end = entry.tstamp; open.delete(key); }
    }
    for (const key of entry.on || []) {
      const again = /^(.*)-rend(\d+)$/.exec(key), id = again ? again[1] : key;
      if (!pitches.has(id)) pitches.set(id, tk.getMIDIValuesForElement(id)?.pitch);
      const e = { id, time: entry.tstamp, end: entry.tstamp, pitch: pitches.get(id), pass: again ? +again[2] : 1 };
      open.set(key, e);
      if (e.pitch) events.push(e);
    }
  }
  events = events.filter(e => e.end > e.time).sort((a, b) => a.time - b.time);
  stops = [];
  for (const e of events) if (!stops.length || stops[stops.length - 1].time !== e.time) stops.push({ time: e.time, id: e.id, pass: e.pass });
  total = events.reduce((m, e) => Math.max(m, e.end), 0);
  position = Math.min(position, total);

  shown = true;
  $('empty').hidden = true;
  for (const id of ['pdf', 'print', 'saveSource', 'midi', 'stop']) $(id).disabled = false;
  $('play').disabled = !events.length;
  showPicked();
  paint();
  if (wasPlaying) play();
  return true;
}

// A new score: from a file, from the recogniser, or pasted.
async function setScore(text) {
  await engine;
  stopPlaying();
  score = text;
  selected = null;
  history.length = 0;
  $('text').value = text;
  if (engrave()) sayShown();
}

// ---------- the source pane ----------

function showSource(on, tab) {
  $('source').hidden = !on;
  $('showSource').classList.toggle('on', on);
  if (!tab) tab = $('original').src ? 'picture' : 'text';
  if (tab === 'picture' && !$('original').src) tab = 'text';
  $('picture').hidden = tab !== 'picture';
  $('text').hidden = tab !== 'text';

  $('tabText').classList.toggle('on', tab === 'text');
