<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">
<title>Score Reader</title>
<link rel="icon" href="icon.svg">
<!-- Light by day, dark by night, with the homepage's own logic and toggle. -->

<style>
  /* Colours follow the homepage: light by default, dark when ../theme.js sets data-theme="dark". */
  :root {
    color-scheme: light;
    --bg: #e8eaed; --panel: #ffffff; --line: #d4d4d4; --text: #000000; --muted: #666666;
    --accent: #1772d0; --on-accent: #ffffff; --btn: #f2f2f2; --btn-hover: #e6e6e6; --bad: #c62828;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #101216; --panel: #15181d; --line: #363b44; --text: #e4e6ea; --muted: #99a2ad;
    --accent: #6ab0f3; --on-accent: #0d1117; --btn: #23272e; --btn-hover: #2c313a; --bad: #ff8080;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  button, a.button {
    font: inherit; color: var(--text); background: var(--btn);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer;
    text-decoration: none; text-align: center;
  }
  button:hover:not(:disabled), a.button:hover { background: var(--btn-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.12); }
  button.on, button.on:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  /* the same Home pill as on the project pages */
  .home-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px;
    background: var(--btn); border: 1px solid var(--line); color: var(--text);
    font-weight: 600; text-decoration: none;
  }
  .home-link:hover { background: var(--btn-hover); }
  .theme-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
  }
  .theme-toggle svg { display: block; width: 15px; height: 15px; }
  .theme-toggle .icon-sun, [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
  .seg { display: flex; }
  .seg button { flex: 1; border-radius: 0; padding: 4px 8px; }
  .seg button + button { border-left: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }

  main { flex: 1; display: flex; min-height: 0; }

  /* left: what the score was made from, the picture and the text */
  #source {
    width: 34%; min-width: 260px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  #source[hidden] { display: none; }
  #source .seg { padding: 8px; }
  #picture { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 8px; }
  #picture img { display: block; width: 100%; background: #fff; }
  #picture[hidden], #text[hidden] { display: none; }
  #text {
    flex: 1; min-height: 0; margin: 0 8px 8px; padding: 8px; resize: none;
    font: 12px/1.45 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    white-space: pre; user-select: text;
  }

  #stage { flex: 1; position: relative; min-width: 0; }
  #pages { position: absolute; inset: 0; overflow: auto; padding: 20px; }
  #pages .page {
    max-width: 900px; margin: 0 auto 20px; background: #fff; color: #000;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
  }
  #pages .page svg { display: block; width: 100%; height: auto; }
  /* the whole box of a note takes the click: the inside of a half note is empty */
  #pages .note { cursor: pointer; pointer-events: bounding-box; }
  /* Played once: blue. Played again in a repeat: purple. Sounding now: red. Picked for editing: green. */
  #pages .played, #pages .played * { fill: #2f7fd0; stroke: #2f7fd0; }
  #pages .played2, #pages .played2 * { fill: #8a4fc7; stroke: #8a4fc7; }
  #pages .selected, #pages .selected * { fill: #0e9a55; stroke: #0e9a55; }
  #pages .playing, #pages .playing * { fill: #d5382a; stroke: #d5382a; }
  /* the line that shows where playback is */
  #cursor {
    position: absolute; width: 2px; margin-left: -1px; border-radius: 1px;
    background: #d5382a; box-shadow: 0 0 0 1px rgba(213, 56, 42, .18); pointer-events: none;
  }
  #cursor[hidden] { display: none; }
  /* above the line during a repeat: which time through */
  #cursor b {
    position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
    padding: 0 5px; border-radius: 8px; background: #8a4fc7; color: #fff; font: 600 11px/16px system-ui, sans-serif;
  }
  #cursor b:empty { display: none; }
  #stage.busy #pages { opacity: .4; }
  #busy {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 8px 16px; border-radius: 8px; background: rgba(0, 0, 0, .72); color: #fff; text-align: center;
  }
  #stage:not(.busy) #busy { display: none; }
  #empty {
    position: absolute; inset: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); cursor: pointer;
  }
  #empty[hidden] { display: none; }
  #empty b { font-size: 20px; font-weight: 600; color: var(--text); }
  body.dragging #stage { outline: 2px solid var(--accent); outline-offset: -2px; }

  aside {
    width: 300px; flex: none; display: flex; flex-direction: column; gap: 9px;
    padding: 14px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  }
  aside h2 { margin: 6px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  aside h2:first-child { margin-top: 0; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field > label { flex: 1; }
  input[type=text], input[type=number], select, aside textarea {
    font: inherit; color: var(--text); background: var(--btn);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px;
  }
  input[type=text], aside textarea { width: 100%; user-select: text; }
  aside textarea { resize: vertical; min-height: 3.6em; }
  input[type=number], select { width: 130px; }
  input[type=range] { width: 130px; accent-color: var(--accent); }
  .value { width: 44px; text-align: right; color: var(--muted); font-size: 13px; }
  aside .row { display: flex; gap: 8px; }
  aside .row button, aside .row a.button { flex: 1; padding: 7px 6px; }
  aside .row.keys { gap: 5px; }
  aside .row.keys button { padding: 5px 0; font-size: 15px; }
  #picked { min-height: 1.5em; font-size: 13px; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { margin: 0; }
  #status { min-height: 3em; font-size: 13px; }
  #status.bad { color: var(--bad); }
  #bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  #bar[hidden] { display: none; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .note-text { color: var(--muted); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
  .credit { margin-top: auto; padding-top: 8px; color: var(--muted); font-size: 12px; }
  .credit a { color: var(--accent); }
  /* holds the pages for the print dialog; it has to be in the page, but is never seen */
  #printFrame { position: fixed; right: 0; bottom: 0; width: 0; height: 0; border: 0; visibility: hidden; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 8px; background: #2f7d4f; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: #a13c3c; }
</style>
</head>
<body>
<header>
  <a class="home-link" href="../" title="Back to Chang Luo's homepage">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10.5V20h5v-6h4v6h5v-9.5"/></svg>
    <span data-i18n="home"></span>
  </a>
  <button id="open" data-i18n="open"></button>
  <button id="showSource" data-i18n="showSource"></button>
  <span class="hint" data-i18n="hint"></span>
  <button id="lang"></button>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 1.6v2.6M12 19.8v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.6 12h2.6M19.8 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"></path></svg>
  </button>
</header>
<main>
  <section id="source" hidden>
    <div class="seg">
      <button id="tabPicture" data-i18n="tabPicture"></button>
      <button id="tabText" data-i18n="tabText"></button>

    <div id="picture"><img id="original" alt=""></div>
    <textarea id="text" spellcheck="false" hidden></textarea>
  </section>
  <div id="stage">
    <div id="pages"></div>
    <div id="busy"></div>
    <div id="empty">
      <b data-i18n="emptyTitle"></b>
      <span data-i18n="emptySub"></span>
    </div>
  </div>
  <aside>
    <h2 data-i18n="statusTitle"></h2>
    <div id="status"></div>
    <div id="bar" hidden><i></i></div>

    <h2 data-i18n="playTitle"></h2>
    <div class="field">
      <label for="instrument" data-i18n="instrument"></label>
      <select id="instrument">
        <option value="acoustic_grand_piano" data-i18n="piano"></option>
        <option value="violin" data-i18n="violin"></option>
        <option value="flute" data-i18n="flute"></option>
      </select>
    </div>
    <div class="field">
      <label for="bpm" data-i18n="bpm"></label>
      <input type="number" id="bpm" min="20" max="300" step="1" data-i18n-placeholder="bpmHint">
    </div>
    <div class="field">
      <label for="tempo" data-i18n="tempo"></label>
      <input type="range" id="tempo" min="40" max="160" step="5"><span class="value" id="tempoValue"></span>
    </div>
    <div class="row">
      <button id="play" class="primary" disabled></button>
      <button id="stop" disabled data-i18n="stop"></button>
    </div>
    <div class="legend">
      <span><i style="background:#d5382a"></i><span data-i18n="legendNow"></span></span>
      <span><i style="background:#2f7fd0"></i><span data-i18n="legendPlayed"></span></span>
      <span><i style="background:#8a4fc7"></i><span data-i18n="legendAgain"></span></span>
    </div>
    <div class="row"><a class="button" id="metronome" href="../metronome/" target="metronome" data-i18n="metronome"></a></div>

    <h2 data-i18n="noteTitle"></h2>
    <div id="picked"></div>
    <div class="row keys">
      <button id="flat" disabled title="♭">♭</button>
      <button id="natural" disabled title="♮">♮</button>
      <button id="sharp" disabled title="♯">♯</button>
    </div>
    <div class="row keys">
      <button id="down2" disabled data-i18n="down2"></button>
      <button id="down1" disabled data-i18n="down1"></button>
      <button id="up1" disabled data-i18n="up1"></button>
      <button id="up2" disabled data-i18n="up2"></button>
    </div>
    <div class="note-text" data-i18n="noteHint"></div>

    <h2 data-i18n="layoutTitle"></h2>
    <input type="text" id="title" data-i18n-placeholder="titleHint">
    <input type="text" id="subtitle" data-i18n-placeholder="subtitleHint">
    <textarea id="composer" rows="2" data-i18n-placeholder="composerHint"></textarea>
    <div class="field">
      <label for="paper" data-i18n="paper"></label>
      <select id="paper">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
      </select>
    </div>
    <div class="field">
      <label for="size" data-i18n="size"></label>
      <input type="range" id="size" min="40" max="130" step="1"><span class="value" id="sizeValue"></span>
    </div>
    <label class="check"><input type="checkbox" id="lines"><span data-i18n="lines"></span></label>

    <h2 data-i18n="exportTitle"></h2>
    <div class="row">
      <button id="pdf" class="primary" disabled data-i18n="pdf"></button>
      <button id="print" disabled data-i18n="print"></button>
    </div>
    <div class="row">
      <button id="saveSource" disabled data-i18n="saveSource"></button>
      <button id="midi" disabled data-i18n="midi"></button>
    </div>
    <div class="credit">
      <span data-i18n="credit"></span>
      <a href="https://github.com/liebharc/homr" target="_blank" rel="noopener">homr</a> (AGPL-3.0, <a href="homr/README.txt" target="_blank" data-i18n="sourceLink"></a>) ·
      <a href="https://www.verovio.org/" target="_blank" rel="noopener">Verovio</a> ·
      <a href="https://github.com/naptha/tesseract.js" target="_blank" rel="noopener">Tesseract.js</a> ·
      <a href="https://github.com/gleitz/midi-js-soundfonts" target="_blank" rel="noopener">FluidR3 GM</a>
    </div>
  </aside>
</main>
<input type="file" id="file" accept="image/*,.musicxml,.mxl,.xml,.mei,.abc" hidden>
<div id="toast"></div>

const t = (key, x = '', more = {}) => TEXT[lang][key].replace(/\{(\w+)\}/g, (_, k) => k === 'x' ? x : more[k]);

const DEFAULTS = { instrument: 'acoustic_grand_piano', tempo: 100, paper: 'A4', size: 100, lines: true };
let cfg = { ...DEFAULTS };
try { cfg = { ...cfg, ...JSON.parse(localStorage.getItem('score-settings') || '{}') }; } catch {}
if (!PAPERS[cfg.paper]) cfg.paper = 'A4';

let status = { key: 'engine', x: '', more: {}, bad: false, tail: '' };   // kept so it can be re-translated
let tk = null;          // the Verovio toolkit, once loaded
let score = '';         // the text the score is engraved from: MusicXML, MEI or ABC
let name = 'score';     // for the names of saved files
let shown = false;      // a score is on the page
// What playback goes through, in the order it sounds: repeats are written out, so a note that
// is played twice is here twice. Times are milliseconds at the score's own tempo.
let events = [];        // { id, time, end, pitch, pass }
let stops = [];         // the moments something starts: { time, id, pass }, for the playback line
let total = 0;          // when the last note ends
let position = 0;       // where playback is, or will start from
let selected = null;    // id of the note picked for editing
const history = [];     // earlier texts of the score, for undo
let toastTimer = 0;

function say(key, x = '', bad = false, tail = '', more = {}) {
  status = { key, x, more, bad, tail };
  $('status').textContent = key ? t(key, x, more) + tail : '';
  $('status').className = bad ? 'bad' : '';
}
const sayShown = () => say('shown', '', false, '', { p: $('pages').querySelectorAll('.page').length, n: new Set(events.map(e => e.id)).size });

function toast(text, bad) {
  const el = $('toast');
  el.textContent = text;
  el.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = bad ? 'bad' : '', 2200);
}

function busy(text) {
  $('busy').textContent = text || '';
  $('stage').classList.toggle('busy', !!text);
}

// ---------- engraving ----------

const engine = (async () => {
  const [{ default: createModule }, { VerovioToolkit }] = await Promise.all([
    import(VEROVIO + 'verovio-module.mjs'), import(VEROVIO + 'verovio.mjs'),
  ]);
  tk = new VerovioToolkit(await createModule());
})();

const isXml = text => /^\s*</.test(text);
const isMusicXml = text => isXml(text) && /<score-(partwise|timewise)[\s>]/.test(text);
const parse = text => new DOMParser().parseFromString(text, 'application/xml');
const escapeXml = v => v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Recognised scores come without beams, and jump between their voices note by note.
// Each measure is rewritten voice after voice, with every note at the time it had, and
// in each voice neighbouring eighths and shorter notes inside one beat are joined by a beam.
// A score that has beams of its own is left as it is.
function tidy(doc) {
  if (doc.querySelector('beam')) return;
  const SHORT = new Set(['eighth', '16th', '32nd', '64th', '128th']);
  const make = (tag, text) => { const el = doc.createElement(tag); if (text !== undefined) el.textContent = text; return el; };
  for (const part of doc.querySelectorAll('part')) {
    let divisions = 1, beats = 4, beatType = 4;
    for (const measure of part.children) {
      if (measure.tagName !== 'measure') continue;
      const before = [], after = [], voices = new Map();
      let at = 0, waiting = [], chordOf = null, lastVoice = null;
      for (const el of [...measure.children]) {
        const number = sel => +(el.querySelector(sel)?.textContent || 0);
        const tag = el.tagName;
        if (tag === 'attributes') {
          divisions = number('divisions') || divisions;
          if (el.querySelector('time')) { beats = number('time > beats') || 4; beatType = number('time > beat-type') || 4; }
        }
        if (tag === 'backup') at -= number('duration');
        else if (tag === 'forward') at += number('duration');
        else if (tag !== 'note') {
          // what stands ahead of the first note stays there; the rest travels with the next note
          if (lastVoice) waiting.push({ time: at, els: [el], length: 0 }); else before.push(el);
        } else if (el.querySelector('chord') && chordOf) chordOf.els.push(el);
        else {
          const key = (el.querySelector('voice')?.textContent || '1') + '/' + (el.querySelector('staff')?.textContent || '1');
          if (!voices.has(key)) voices.set(key, []);
          lastVoice = voices.get(key);
          lastVoice.push(...waiting);
          waiting = [];
          const length = el.querySelector('grace') ? 0 : number('duration');
          chordOf = {
            time: at, els: [el], length, note: el,
            short: length > 0 && !el.querySelector('rest') && SHORT.has(el.querySelector('type')?.textContent),
          };
          lastVoice.push(chordOf);
          at += length;
        }
      }
      // what is left over closes the measure: its bar line
      for (const item of waiting) after.push(...item.els);
      if (!lastVoice) continue;

      // a beat: the dotted quarter in 6/8, 9/8 and 12/8, otherwise the quarter
      const beat = beatType === 8 && beats % 3 === 0 && beats > 3 ? divisions * 1.5 : divisions;
      measure.replaceChildren(...before);
      let cursor = 0, end = 0;
      const move = to => {
        if (to === cursor) return;
        const el = make(to > cursor ? 'forward' : 'backup');
        el.append(make('duration', Math.abs(to - cursor)));
        measure.append(el);
        cursor = to;
      };
      for (const items of voices.values()) {
        let group = [];
        const close = () => {
          group.forEach((item, i) => {
            if (group.length < 2) return;
            const beam = make('beam', i === 0 ? 'begin' : i === group.length - 1 ? 'end' : 'continue');
            beam.setAttribute('number', '1');
            // the schema wants beams ahead of these
            item.note.insertBefore(beam, item.note.querySelector('notations, lyric, play, listen'));
          });
          group = [];
        };
        for (const item of items) {
          move(item.time);
          measure.append(...item.els);
          cursor += item.length;
          end = Math.max(end, cursor);
          if (!item.note || !item.length) continue;   // a dynamic or a grace note does not break a beam
          const first = group[0], last = group[group.length - 1];
          if (!item.short || (first && (Math.floor(first.time / beat) !== Math.floor(item.time / beat) || last.time + last.length !== item.time))) close();
          if (item.short) group.push(item);
        }
        close();
      }
      move(end);
      measure.append(...after);
    }
  }
}

// MusicXML laid out for reading and fixing by hand: the recogniser writes it on one line.
function pretty(text) {
  const doc = typeof text === 'string' ? parse(text) : text;
  if (doc.querySelector('parsererror')) return String(text);
  const lines = ['<?xml version="1.0" encoding="UTF-8"?>'];
  const write = (el, indent) => {
    const attrs = [...el.attributes].map(a => ` ${a.name}="${escapeXml(a.value).replace(/"/g, '&quot;')}"`).join('');
    const children = [...el.children], value = el.textContent.trim();
    if (!children.length) lines.push(indent + (value ? `<${el.tagName}${attrs}>${escapeXml(value)}</${el.tagName}>` : `<${el.tagName}${attrs}/>`));
    else {
      lines.push(`${indent}<${el.tagName}${attrs}>`);
      for (const child of children) write(child, indent + '  ');
      lines.push(`${indent}</${el.tagName}>`);
    }
  };
  write(doc.documentElement, '');
  return lines.join('\n') + '\n';
}

// What the recogniser adds that the picture did not have: the name it gives the part.
function fromPicture(xml) {
  const doc = parse(xml);
  if (doc.querySelector('parsererror')) return xml;
  for (const el of doc.querySelectorAll('part-name, part-abbreviation')) el.textContent = '';
  return pretty(doc);
}

const heading = () => ({
  title: $('title').value.trim(), subtitle: $('subtitle').value.trim(),
  composer: $('composer').value.split('\n').map(v => v.trim()).filter(Boolean),
});

// MusicXML as it is engraved: with beams, with a number on every note (the notes on the page
// get the same, so a click finds its note here), and with the tempo and names from the side panel.
// Other formats pass through.
function prepare(text) {
  if (!isMusicXml(text)) return text;
  const doc = parse(text);
  if (doc.querySelector('parsererror')) return text;   // Verovio will say what is wrong with it
  tidy(doc);
  doc.querySelectorAll('note').forEach((el, i) => el.setAttribute('id', 'n' + i));
  const root = doc.documentElement, { title, subtitle, composer } = heading();
  const make = (tag, value) => { const el = doc.createElement(tag); el.textContent = value; return el; };
  if (title || subtitle) {
    for (const el of root.querySelectorAll(':scope > work, :scope > movement-title')) el.remove();
    if (subtitle) root.prepend(make('movement-title', subtitle));
    if (title) { const work = doc.createElement('work'); work.append(make('work-title', title)); root.prepend(work); }
  }
  const identification = root.querySelector(':scope > identification');
  if (composer.length && identification) {
    for (const el of identification.querySelectorAll(':scope > creator')) el.remove();
    const creator = make('creator', composer.join(', '));
    creator.setAttribute('type', 'composer');
    identification.prepend(creator);
  }
  const bpm = +$('bpm').value, first = doc.querySelector('part > measure');
  if (bpm >= 20 && bpm <= 300 && first) {
    for (const el of first.querySelectorAll(':scope > direction')) if (el.querySelector('metronome')) el.remove();
    // the beat is the dotted quarter in 6/8, 9/8 and 12/8, otherwise the quarter
    const beats = +(first.querySelector('time > beats')?.textContent || 4), type = +(first.querySelector('time > beat-type')?.textContent || 4);
    const dotted = type === 8 && beats % 3 === 0 && beats > 3;
    const direction = doc.createElement('direction');
    direction.setAttribute('placement', 'above');
    direction.innerHTML = `<direction-type><metronome><beat-unit>quarter</beat-unit>${dotted ? '<beat-unit-dot/>' : ''}<per-minute>${bpm}</per-minute></metronome></direction-type><staff>1</staff><sound tempo="${dotted ? bpm * 1.5 : bpm}"/>`;
    const lead = [...first.children].filter(el => el.tagName === 'attributes' || el.tagName === 'print').pop();
    if (lead) lead.after(direction); else first.prepend(direction);
  }
  return new XMLSerializer().serializeToString(doc);
}

function options(ownHeader) {
  const [w, h] = PAPERS[cfg.paper];
  // Verovio lays out in tenths of a millimetre at scale 100, where a staff is 7.2 mm high;
  // a smaller scale on a page made larger by the same factor keeps the paper and shrinks the music.
  const f = 100 / cfg.size, margin = Math.round(MARGIN * 10 * f);
  return {
    pageWidth: Math.round(w * 10 * f), pageHeight: Math.round(h * 10 * f), scale: cfg.size,
    pageMarginLeft: margin, pageMarginRight: margin, pageMarginTop: margin, pageMarginBottom: margin,
    adjustPageHeight: false, footer: 'none', svgViewBox: true,
    header: ownHeader ? 'encoded' : 'auto',
    // 'line' keeps the systems of the original and still fills the pages itself
    breaks: cfg.lines && /<print\b[^>]*new-system="yes"|<sb[\s\/>]/.test(score) ? 'line' : 'auto',
  };
}

// Loads `score` into Verovio. The title, the subtitle and the composer from the side panel are set
// at the head of the first page the way printed music has them: title and subtitle in the middle,
// the composer below them on the right.
function load() {
  const { title, subtitle, composer } = heading(), own = !!(title || subtitle || composer.length);
  tk.setOptions(options(own));
  let ok = false;
  try { ok = tk.loadData(prepare(score)); } catch (err) { console.error(err); }
  if (!ok || !own) return ok;
  const middle = [title && `<rend fontsize="x-large">${escapeXml(title)}</rend>`, subtitle && `<rend fontsize="large">${escapeXml(subtitle)}</rend>`].filter(Boolean).join('<lb/>');
  const head = '<pgHead func="first">'
    + (middle ? `<rend halign="center" valign="top">${middle}</rend>` : '')
    + (composer.length ? `<rend halign="right" valign="bottom">${composer.map(escapeXml).join('<lb/>')}</rend>` : '')
    + '</pgHead>';
  const mei = tk.getMEI().replace(/<pgHead\b[\s\S]*?<\/pgHead>/g, '').replace(/(<scoreDef\b[^>]*>)/, '$1' + head);
  try { return tk.loadData(mei); } catch (err) { console.error(err); return false; }
}

// Engraves `score` and puts the pages on screen. Returns false if it is not a score.
function engrave() {
  const wasPlaying = !!playing;
  stopPlaying(true);
  if (!load() || !tk.getPageCount()) {
    // keep what was on the page: a slip while typing should not blank it
    say('badScore', '', true, (tk.getLog() || '').trim().split('\n').pop().slice(0, 200));
    return false;
  }
  const pages = $('pages');
  pages.replaceChildren();
  for (let i = 1; i <= tk.getPageCount(); i++) {
    const page = document.createElement('div');
    page.className = 'page';
    page.innerHTML = tk.renderToSVG(i);
    pages.append(page);
  }
  const cursor = document.createElement('div');
  cursor.id = 'cursor'; cursor.hidden = true;
  cursor.append(document.createElement('b'));
  pages.append(cursor);

  // What to play, from Verovio's own MIDI rendering. It writes repeats out: the second time
  // through, a note comes with "-rend2" after its id.
  tk.renderToMIDI();
  events = [];
  const open = new Map(), pitches = new Map();
  for (const entry of tk.renderToTimemap()) {
    for (const key of entry.off || []) {
      const e = open.get(key);
      if (e) { e.end = entry.tstamp; open.delete(key); }
    }
    for (const key of entry.on || []) {
      const again = /^(.*)-rend(\d+)$/.exec(key), id = again ? again[1] : key;
      if (!pitches.has(id)) pitches.set(id, tk.getMIDIValuesForElement(id)?.pitch);
      const e = { id, time: entry.tstamp, end: entry.tstamp, pitch: pitches.get(id), pass: again ? +again[2] : 1 };
      open.set(key, e);
      if (e.pitch) events.push(e);
    }
  }
  events = events.filter(e => e.end > e.time).sort((a, b) => a.time - b.time);
  stops = [];
  for (const e of events) if (!stops.length || stops[stops.length - 1].time !== e.time) stops.push({ time: e.time, id: e.id, pass: e.pass });
  total = events.reduce((m, e) => Math.max(m, e.end), 0);
  position = Math.min(position, total);

  shown = true;
  $('empty').hidden = true;
  for (const id of ['pdf', 'print', 'saveSource', 'midi', 'stop']) $(id).disabled = false;
  $('play').disabled = !events.length;
  showPicked();
  paint();
  if (wasPlaying) play();
  return true;
}

// A new score: from a file, from the recogniser, or pasted.
async function setScore(text) {
  await engine;
  stopPlaying();
  score = text;
  selected = null;
  history.length = 0;
  $('text').value = text;
  if (engrave()) sayShown();
}

// ---------- the source pane ----------

function showSource(on, tab) {
  $('source').hidden = !on;
  $('showSource').classList.toggle('on', on);
  if (!tab) tab = $('original').src ? 'picture' : 'text';
  if (tab === 'picture' && !$('original').src) tab = 'text';
  $('picture').hidden = tab !== 'picture';
  $('text').hidden = tab !== 'text';
  $('tabPicture').classList.toggle('on', tab === 'picture');
  $('tabText').classList.toggle('on', tab === 'text');
  $('tabPicture').disabled = !$('original').src;
  placeCursor();
}

// ---------- recognition ----------

let worker = null, job = 0, started = 0;
let top = null;         // promise of what was read at the top of the picture
let reader = null;      // promise of the OCR worker

const TEMPO_WORDS = {
  grave: 40, largo: 50, lento: 56, larghetto: 60, adagio: 70, andante: 84, andantino: 92, moderato: 108,
  allegretto: 116, allegro: 132, vivace: 160, presto: 180, prestissimo: 200,
};

// Title, subtitle, composer and tempo, from the strip of the picture above the first staff.
// The title is the large line in the middle and the subtitle the line under it; what stands at the
// right edge names the composer; the tempo is a number after an equals sign (as in "♩ = 96"),
// or else a tempo word.
async function readHeader(png) {
  await loadScript(TESSERACT);
  reader ||= Tesseract.createWorker(['eng', 'chi_sim', 'jpn']);
  reader.catch(() => { reader = null; });
  // small print reads better enlarged
  const small = await createImageBitmap(png), zoom = Math.min(4, Math.max(1, 2400 / small.width));
  const canvas = document.createElement('canvas');
  const W = canvas.width = Math.round(small.width * zoom);
  canvas.height = Math.round(small.height * zoom);
  const g = canvas.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(small, 0, 0, canvas.width, canvas.height);
  const { data } = await (await reader).recognize(canvas, {}, { blocks: true });

  // Words that stand together make a line; a stray mark far away on the same height does not belong.
  const lines = [];
  const cjk = /[\u3040-\u30ff\u3400-\u9fff]/;
  for (const line of (data.blocks || []).flatMap(b => b.paragraphs).flatMap(p => p.lines)) {
    const height = line.bbox.y1 - line.bbox.y0;
    let group = [];
    const close = () => {
      if (group.length) lines.push({
        text: group.reduce((text, w) => text + (text && !(cjk.test(text.slice(-1)) && cjk.test(w.text[0])) ? ' ' : '') + w.text, ''),
        confidence: Math.min(...group.map(w => w.confidence)), height, top: line.bbox.y0,
        left: group[0].bbox.x0, right: group[group.length - 1].bbox.x1,
      });
      group = [];
    };
    for (const word of line.words) {
      if (!word.text.trim()) continue;
      if (group.length && word.bbox.x0 - group[group.length - 1].bbox.x1 > 2.5 * height) close();
      group.push(word);
    }
    close();
  }
  if (QUERY.has('debug')) console.log(JSON.stringify(lines));

  const found = {};
  const all = lines.map(l => l.text).join('\n');
  const number = /[=＝]\s*(?:c(?:a|irca)?\.?\s*)?(\d{2,3})(?!\d)/.exec(all);
  if (number && +number[1] >= 30 && +number[1] <= 260) found.bpm = +number[1];
  else {
    const word = all.toLowerCase().match(new RegExp('\\b(' + Object.keys(TEMPO_WORDS).join('|') + ')\\b'));
    if (word) found.bpm = TEMPO_WORDS[word[1]];
  }
  // read with some confidence, and real words
  const words = lines.filter(l => l.confidence > 55 && /\p{L}{2,}/u.test(l.text) && !/[=＝]\s*\d/.test(l.text));
  const off = l => Math.abs((l.left + l.right) / 2 - W / 2) / (W / 2);   // 0 in the middle, 1 at an edge
  const middle = words.filter(l => off(l) < .4);
  if (middle.length) {
    const tallest = Math.max(...middle.map(l => l.height));
    const rank = l => .3 * l.height / tallest + .7 * (1 - off(l));
    const title = middle.slice().sort((a, b) => rank(b) - rank(a))[0];
    found.title = title.text;
    const under = middle.filter(l => l !== title && l.top > title.top && l.height <= title.height).sort((a, b) => a.top - b.top)[0];
    if (under) found.subtitle = under.text;
  }
  const right = words.filter(l => l.right > .72 * W && (l.left + l.right) / 2 > .6 * W && l.text !== found.title && l.text !== found.subtitle);
  if (right.length) found.composer = right.sort((a, b) => a.top - b.top).map(l => l.text).join('\n');
  return found;
}

function recognise(blob) {
  if (typeof WebAssembly?.Suspending !== 'function') { say('needsJspi', '', true); return; }
  if (!worker) {
    worker = new Worker('omr-worker.mjs', { type: 'module' });
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === 'stage') {
        if (m.stage === 'download') { $('bar').hidden = false; $('bar').firstElementChild.style.width = m.extra + '%'; }
        else $('bar').hidden = true;
        say(m.stage, m.extra ?? '');
        busy(t(m.stage, m.extra ?? ''));
      } else if (m.type === 'log') {
        console.warn(m.line);
      } else if (m.id !== job) {
        // an older picture: nothing to do with it
      } else if (m.type === 'header') {
        // read while the staves are being recognised
        top = readHeader(new Blob([m.png], { type: 'image/png' })).catch(err => { console.error(err); return {}; });
        // the same proportions as the picture: as many staff heights across the page
        if (m.unit > 0 && m.width > 0) {
          const across = PAPERS[cfg.paper][0] - 2 * MARGIN;
          cfg.size = Math.min(130, Math.max(40, Math.round(100 * (4 * m.unit / m.width) * across / 7.2)));
          showSettings();
        }
      } else {
        $('bar').hidden = true;
        if (m.type === 'done') {
          const mine = job;
          (async () => {
            if (top) { say('header'); busy(t('header')); }
            const found = await Promise.race([top || {}, new Promise(res => setTimeout(res, 40000, {}))]);
            if (mine !== job) return;
            busy('');
            for (const key of ['title', 'subtitle', 'composer', 'bpm']) if (found[key] && !$(key).value) $(key).value = found[key];
            await setScore(fromPicture(m.xml));
            if (!status.bad) say('recognised', ((performance.now() - started) / 1000).toFixed(0));
          })();
        } else {
          busy('');
          say('omrFailed', '', true, m.message);
          $('empty').hidden = shown;   // nothing to show: back to the invitation
        }
      }
    };
    worker.onerror = e => { busy(''); say('omrFailed', '', true, e.message || 'worker'); worker = null; };
  }
  (async () => {
    // Whatever the picture is, the recogniser gets a PNG on white.
    let bitmap;
    try { bitmap = await createImageBitmap(blob); } catch { toast(t('badFile'), true); return; }
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width; canvas.height = bitmap.height;
    const g = canvas.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, canvas.width, canvas.height);
    g.drawImage(bitmap, 0, 0);
    const png = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if ($('original').src) URL.revokeObjectURL($('original').src);
    $('original').src = URL.createObjectURL(png);
    showSource(true, 'picture');
    $('empty').hidden = true;
    started = performance.now();
    top = null;
    forget();
    say('runtime'); busy(t('runtime'));
    const image = await png.arrayBuffer();
    worker.postMessage({ id: ++job, image, models: MODELS }, [image]);
  })();
}

// the names and the tempo in the side panel belonged to the score before
function forget() {
  for (const id of ['title', 'subtitle', 'composer', 'bpm']) $(id).value = '';
}

async function openFile(file) {
  const lower = file.name.toLowerCase();
  if (file.type.startsWith('image/')) {
    name = file.name.replace(/\.[^.]+$/, '') || 'score';
    recognise(file);
  } else if (/\.(musicxml|xml|mei|abc)$/.test(lower)) {
    name = file.name.replace(/\.[^.]+$/, '');
    forget();
    setScore(await file.text());
  } else if (lower.endsWith('.mxl')) {
    // compressed MusicXML: Verovio unpacks it; the text pane then holds its MEI
    name = file.name.replace(/\.[^.]+$/, '');
    await engine;
    forget();
    if (tk.loadZipDataBuffer(await file.arrayBuffer())) setScore(tk.getMEI());
    else say('badScore', '', true, file.name);
  } else toast(t('badFile'), true);
}

// ---------- changing a note ----------

const STEPS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const SHARPS = 'FCGDAEB';   // the order in which key signatures add sharps; flats come in reverse
const WITH_SHARPS = [['C', 0], ['C', 1], ['D', 0], ['D', 1], ['E', 0], ['F', 0], ['F', 1], ['G', 0], ['G', 1], ['A', 0], ['A', 1], ['B', 0]];
const WITH_FLATS = [['C', 0], ['D', -1], ['D', 0], ['E', -1], ['E', 0], ['F', 0], ['G', -1], ['G', 0], ['A', -1], ['A', 0], ['B', -1], ['B', 0]];
const SIGNS = { '-2': 'flat-flat', '-1': 'flat', 0: 'natural', 1: 'sharp', 2: 'double-sharp' };
const SHOWN = { '-2': '𝄫', '-1': '♭', 0: '', 1: '♯', 2: '𝄪' };

// what the key signature does to a note of this name
const inKey = (fifths, step) => fifths > 0 && SHARPS.indexOf(step) < fifths ? 1
  : fifths < 0 && 6 - SHARPS.indexOf(step) < -fifths ? -1 : 0;

// The note of the score text that the picked note on the page stands for.
function pickedNote(doc) {
  const m = /^n(\d+)$/.exec(selected || '');
  const el = m && isMusicXml(score) ? doc.querySelectorAll('note')[+m[1]] : null;
  return el?.querySelector('pitch') ? el : null;
}

function readPitch(el) {
  const pitch = el.querySelector('pitch');
  return {
    step: pitch.querySelector('step').textContent.trim(),
    alter: Math.round(+(pitch.querySelector('alter')?.textContent || 0)),
    octave: +pitch.querySelector('octave').textContent,
  };
}

// The key signature in force at a measure.
function keyAt(measure) {
  let fifths = 0;
  for (const m of measure.parentElement.children) {
    const key = m.querySelector(':scope > attributes > key > fifths');
    if (key) fifths = +key.textContent || 0;
    if (m === measure) break;
  }
  return fifths;
}

// Moves the picked note by semitones, or sets its accidental. The accidentals printed in its
// measure are then worked out again: a sign where a note differs from the key signature or from
// the same note earlier in the measure, and none where it does not.
function change(how) {
  const doc = parse(score), el = pickedNote(doc);
  if (!el) { if (selected) toast(t('notEditable'), true); return; }
  const doc0 = score, measure = el.closest('measure'), fifths = keyAt(measure);
  let { step, alter, octave } = readPitch(el);
  if ('set' in how) alter = how.set;
  else {
    const midi = 12 * (octave + 1) + STEPS[step] + alter + how.by;
    // spelled the way the key leans: with sharps in sharp keys, with flats in flat keys
    [step, alter] = (fifths < 0 ? WITH_FLATS : WITH_SHARPS)[((midi % 12) + 12) % 12];
    octave = Math.floor(midi / 12) - 1;
  }
  const pitch = el.querySelector('pitch');
  pitch.querySelector('step').textContent = step;
  pitch.querySelector('octave').textContent = octave;
  pitch.querySelector('alter')?.remove();
  if (alter) { const a = doc.createElement('alter'); a.textContent = alter; pitch.querySelector('step').after(a); }

  const state = new Map();
  for (const note of measure.querySelectorAll(':scope > note')) {
    if (!note.querySelector('pitch')) continue;
    const p = readPitch(note), key = (note.querySelector('staff')?.textContent || '1') + p.step + p.octave;
    const before = state.has(key) ? state.get(key) : inKey(fifths, p.step);
    note.querySelector(':scope > accidental')?.remove();
    // a note tied from the one before keeps that note's sign
    if (p.alter !== before && !note.querySelector('tie[type="stop"]')) {
      const sign = doc.createElement('accidental');
      sign.textContent = SIGNS[p.alter] || 'natural';
      note.insertBefore(sign, note.querySelector(':scope > time-modification, :scope > stem, :scope > notehead, :scope > staff, :scope > beam, :scope > notations, :scope > lyric'));
    }
    state.set(key, p.alter);
  }
  history.push(doc0);
  if (history.length > 200) history.shift();
  score = pretty(doc);
  $('text').value = score;
  if (engrave()) sayShown();
  blip(12 * (octave + 1) + STEPS[step] + alter);
}

function undo() {
  if (!history.length) return;
  score = history.pop();
  $('text').value = score;
  if (engrave()) sayShown();
}

// What is picked, in words and on the page.
function showPicked() {
  for (const el of $('pages').querySelectorAll('.selected')) el.classList.remove('selected');
  if (selected) document.getElementById(selected)?.classList.add('selected');
  const el = selected && isMusicXml(score) ? pickedNote(parse(score)) : null;
  if (el) { const p = readPitch(el); $('picked').textContent = p.step + SHOWN[p.alter] + p.octave; }
  else $('picked').textContent = t(selected && !isMusicXml(score) ? 'notEditable' : 'noNote');
  for (const id of ['flat', 'natural', 'sharp', 'down2', 'down1', 'up1', 'up2']) $(id).disabled = !el;
}

// ---------- playback ----------

let audio = null;
const sounds = new Map();      // instrument -> promise of Map(pitch -> base64 MP3)
const buffers = new Map();     // instrument + pitch -> promise of AudioBuffer
let playing = null;            // { t0, from, rate, voices, frame }

const NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

function loadSound(instrument) {
  if (!sounds.has(instrument)) {
    const p = fetch(SOUNDS + instrument + '-mp3.js').then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }).then(js => {
      const map = new Map();
      for (const m of js.matchAll(/"([A-G]b?)(-?\d)":\s*"data:audio\/mp3;base64,([^"]+)"/g)) {
        map.set(NAMES.indexOf(m[1]) + 12 * (+m[2] + 1), m[3]);
      }
      return map;
    });
    p.catch(() => sounds.delete(instrument));
    sounds.set(instrument, p);
  }
  return sounds.get(instrument);
}

// Only the pitches that are asked for are decoded.
async function loadBuffers(instrument, pitches) {
  const map = await loadSound(instrument);
  await Promise.all([...pitches].map(pitch => {
    const key = instrument + pitch;
    if (!buffers.has(key) && map.has(pitch)) {
      const bytes = Uint8Array.from(atob(map.get(pitch)), c => c.charCodeAt(0));
      buffers.set(key, audio.decodeAudioData(bytes.buffer).catch(() => null));
    }
    return buffers.get(key);
  }));
}

// One note of the instrument from `at` until `until`, on the audio clock.
function voice(buffer, at, until) {
  const piano = cfg.instrument === 'acoustic_grand_piano';
  const src = audio.createBufferSource(), gain = audio.createGain();
  src.buffer = buffer;
  gain.gain.setValueAtTime(piano ? .55 : .4, at);
  // a piano key lets go slowly, a bow or a breath stops at once
  gain.gain.setTargetAtTime(0, until, piano ? .12 : .04);
  src.connect(gain).connect(audio.destination);
  src.start(at);
  src.stop(until + (piano ? .8 : .3));
  return { src, gain };
}

// The sound of a note that was just changed, if the instrument is already there.
async function blip(pitch) {
  if (!audio || !sounds.has(cfg.instrument) || playing) return;
  try {
    await loadBuffers(cfg.instrument, [pitch]);
    const buffer = await buffers.get(cfg.instrument + pitch);
    if (buffer) voice(buffer, audio.currentTime, audio.currentTime + .45);
  } catch {}
}

const now = () => playing ? Math.max(0, playing.from + (audio.currentTime - playing.t0) * 1000 * playing.rate) : position;

// Colours every note for the moment `at`: sounding, played, played again in a repeat, or not yet.
// A note that comes twice shows how far it has got: purple only once its second time is over.
function paint(at = now()) {
  const state = new Map();   // id -> 'playing' | 'played' | 'played2'
  for (const e of events) {
    if (e.time > at) break;
    if (e.end > at) state.set(e.id, 'playing');
    else if (state.get(e.id) !== 'playing') state.set(e.id, e.pass > 1 ? 'played2' : 'played');
  }
  const idle = !playing && at <= 0;
  for (const el of $('pages').querySelectorAll('.playing, .played, .played2')) {
    if (idle || !state.has(el.id)) el.classList.remove('playing', 'played', 'played2');
  }
  if (!idle) for (const [id, cls] of state) {
    const el = document.getElementById(id);
    if (el && !el.classList.contains(cls)) { el.classList.remove('playing', 'played', 'played2'); el.classList.add(cls); }
  }
  placeCursor(at);
}

// Puts the playback line where the music is at the moment `at`: at a note when one starts,
// gliding to the next one in between. It stays on the page while playback is paused.
function placeCursor(at = now()) {
  const cursor = $('cursor');
  if (!cursor) return;
  if (!stops.length || (!playing && at <= 0 && !selected)) { cursor.hidden = true; return; }
  let k = 0;
  while (k + 1 < stops.length && stops[k + 1].time <= at) k++;
  const a = stops[k], b = stops[k + 1];
  const head = id => { const el = document.getElementById(id); return el && (el.querySelector('.notehead') || el).getBoundingClientRect(); };
  const system = document.getElementById(a.id)?.closest('.system');
  const ra = head(a.id);
  if (!ra || !system) { cursor.hidden = true; return; }
  const box = system.getBoundingClientRect(), view = $('pages').getBoundingClientRect();
  const until = b ? b.time : total, share = until > a.time ? Math.min(1, Math.max(0, (at - a.time) / (until - a.time))) : 0;
  // towards the next note if it is in the same system, otherwise towards the end of this one
  const rb = b && document.getElementById(b.id)?.closest('.system') === system ? head(b.id) : null;
  const to = rb && rb.left > ra.left ? rb.left : box.right;
  cursor.hidden = false;
  cursor.style.left = (ra.left + (to - ra.left) * share - view.left + $('pages').scrollLeft) + 'px';
  cursor.style.top = (box.top - view.top + $('pages').scrollTop - 6) + 'px';
  cursor.style.height = (box.height + 12) + 'px';
  cursor.firstElementChild.textContent = a.pass > 1 ? a.pass + '×' : '';
  // keep the system that is sounding on screen
  if (playing && (box.bottom > view.bottom - 10 || box.top < view.top)) {
    $('pages').scrollBy({ top: box.top - view.top - 60, behavior: 'smooth' });
  }
}

// Stops the sound. Paused, the line and the colours stay where they are; stopped, they go.
function stopPlaying(pause) {
  if (playing) {
    cancelAnimationFrame(playing.frame);
    position = Math.min(total, now());
    for (const v of playing.voices) { try { v.gain.gain.cancelScheduledValues(0); v.gain.gain.setTargetAtTime(0, audio.currentTime, .02); v.src.stop(audio.currentTime + .15); } catch {} }
    playing = null;
  }
  if (!pause) position = 0;
  $('play').textContent = t('play');
  paint();
}

async function play() {
  if (playing) { stopPlaying(true); return; }
  if (!events.length) return;
  audio ||= new AudioContext();
  await audio.resume();
  const instrument = cfg.instrument;
  try {
    if (!sounds.has(instrument)) say('loadingSound', t(instrument === 'acoustic_grand_piano' ? 'piano' : instrument));
    await loadBuffers(instrument, new Set(events.map(e => e.pitch)));
    if (status.key === 'loadingSound') sayShown();
  } catch (err) {
    console.error(err);
    say('soundFailed', '', true);
    return;
  }
  if (playing) return;
  if (position >= total) position = 0;
  const rate = cfg.tempo / 100, t0 = audio.currentTime + .08, from = position;
  const voices = [];
  for (const e of events) {
    if (e.time < from - 1) continue;
    const buffer = await buffers.get(instrument + e.pitch);
    if (buffer) voices.push(voice(buffer, t0 + (e.time - from) / 1000 / rate, t0 + (e.end - from) / 1000 / rate));
  }
  playing = { t0, from, rate, voices, frame: 0 };
  $('play').textContent = t('pause');
  const tick = () => {
    if (!playing) return;
    const at = now();
    if (at > total + 300) { stopPlaying(); return; }
    paint(at);
    playing.frame = requestAnimationFrame(tick);
  };
  playing.frame = requestAnimationFrame(tick);
}

// ---------- export ----------

const scripts = new Map();
function loadScript(src) {
  if (!scripts.has(src)) scripts.set(src, new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => { scripts.delete(src); rej(new Error('could not load ' + src)); };
    document.head.append(s);
  }));
  return scripts.get(src);
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

let cjkFont = null;

// The engraved pages as a vector PDF: Verovio's SVG is drawn into the PDF, not rasterised.
async function makePdf() {
  await Promise.all([loadScript(PDFKIT), loadScript(SVG2PDF)]);
  const [w, h] = PAPERS[cfg.paper].map(mm => mm * 72 / 25.4);
  const doc = new PDFDocument({ autoFirstPage: false, compress: true, info: { Title: heading().title || name } });
  const chunks = [];
  doc.on('data', c => chunks.push(c));
  const ended = new Promise(res => doc.on('end', res));
  const pages = [];
  for (let i = 1; i <= tk.getPageCount(); i++) pages.push(tk.renderToSVG(i));

  // Music signs inside text (the note of a tempo mark) are set in the music font, which Verovio
  // carries inside its SVG. The PDF library does not draw that font as text, so the outlines of
  // these signs are taken from the font and drawn as shapes.
  let music = null, musicName = '';
  const face = /font-family:\s*'([^']+)';\s*src:\s*url\(data:application\/font-woff2;charset=utf-8;base64,([^)]+)\)/.exec(pages[0]);
  if (face) {
    try {
      doc.registerFont(face[1], Uint8Array.from(atob(face[2]), c => c.charCodeAt(0)).buffer);
      doc.font(face[1]);
      music = doc._font.font; musicName = face[1];
      doc.font('Times-Roman');
    } catch (err) { console.error(err); music = null; }
  }
  const outline = page => {
    for (const span of page.querySelectorAll('tspan[font-family]')) {
      if (!music || !span.getAttribute('font-family').includes(musicName) || !span.textContent.trim()) continue;
      const k = parseFloat(span.getAttribute('font-size')) / music.unitsPerEm;
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      let { x, y } = span.getStartPositionOfChar(0);
      for (const ch of span.textContent) {
        const glyph = music.glyphForCodePoint(ch.codePointAt(0));
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', glyph.path.toSVG());
        path.setAttribute('transform', `translate(${x}, ${y}) scale(${k}, ${-k})`);
        path.setAttribute('style', 'stroke: none');
        group.append(path);
        x += glyph.advanceWidth * k;
      }
      span.closest('text').after(group);
    }
  };
  // Words outside Latin script need a font that has them.
  let words = '';
  const text = pages.join('').replace(/<style[\s\S]*?<\/style>/g, '').replace(/<[^>]+>/g, '');
  if (/[\u0370-\u1fff\u2e80-\ud7ff\uf900-\uffef]/.test(text)) {
    try {
      cjkFont ||= fetch(CJK_FONT).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
      doc.registerFont('Words', await cjkFont);
      words = 'Words';
    } catch (err) { console.error(err); cjkFont = null; }
  }
  const fontCallback = (family, bold, italic) => {
    if (music && family.includes(musicName)) return musicName;
    if (words) return words;
    return bold && italic ? 'Times-BoldItalic' : bold ? 'Times-Bold' : italic ? 'Times-Italic' : 'Times-Roman';
  };
  // Verovio's SVG leans on its own style sheet (what is hidden, what is stroked): each page is
  // put into the document, out of sight, so that the PDF is drawn from the styles in force.
  const bench = document.createElement('div');
  bench.style.cssText = 'position: fixed; left: -100000px; top: 0; width: 2100px; color: #000';
  document.body.append(bench);
  try {
    for (const svg of pages) {
      bench.innerHTML = svg;
      try { outline(bench); } catch (err) { console.error(err); }
      doc.addPage({ size: [w, h], margin: 0 });
      SVGtoPDF(doc, bench.firstElementChild, 0, 0, { width: w, height: h, preserveAspectRatio: 'xMinYMin meet', useCSS: true, fontCallback });
    }
  } finally { bench.remove(); }
  doc.end();
  await ended;
  return new Blob(chunks, { type: 'application/pdf' });
}

async function withPdf(use) {
  if (!shown || $('stage').classList.contains('busy')) return;
  busy(t('makingPdf'));
  try { await use(await makePdf()); }
  catch (err) { console.error(err); toast(t('pdfFailed') + (err?.message || err), true); }
  busy('');
}

const savePdf = () => withPdf(blob => download(blob, name + '.pdf'));

// Straight to the print dialog: the PDF is loaded into a hidden frame, whose viewer prints it.
let printUrl = '';
const printPdf = () => withPdf(blob => new Promise(done => {
  $('printFrame')?.remove();
  if (printUrl) URL.revokeObjectURL(printUrl);
  const url = printUrl = URL.createObjectURL(blob);
  const frame = document.createElement('iframe');
  frame.id = 'printFrame';
  frame.onload = () => setTimeout(() => {
    try { frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch (err) { console.error(err); window.open(url, '_blank'); toast(t('printOpened'), true); }
    done();
  }, 400);
  frame.src = url;
  document.body.append(frame);
}));

function saveSource() {
  if (!shown) return;
  const ext = isMusicXml(score) ? 'musicxml' : isXml(score) ? 'mei' : 'abc';
  // MusicXML is saved as engraved, with its beams, names and tempo
  download(new Blob([isMusicXml(score) ? pretty(prepare(score)) : score], { type: 'text/plain' }), `${name}.${ext}`);
}

function saveMidi() {
  if (!shown) return;
  const bytes = Uint8Array.from(atob(tk.renderToMIDI()), c => c.charCodeAt(0));
  download(new Blob([bytes], { type: 'audio/midi' }), name + '.mid');
}

// ---------- settings and events ----------

function showSettings() {
  $('instrument').value = cfg.instrument;
  $('tempo').value = cfg.tempo; $('tempoValue').textContent = cfg.tempo + '%';
  $('paper').value = cfg.paper;
  $('size').value = cfg.size; $('sizeValue').textContent = cfg.size + '%';
  $('lines').checked = cfg.lines;
}
function saveSettings() {
  try { localStorage.setItem('score-settings', JSON.stringify(cfg)); } catch {}
  showSettings();
}

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
  $('lang').textContent = t('other');
  $('play').textContent = t(playing ? 'pause' : 'play');
  say(status.key, status.x, status.bad, status.tail, status.more);
  showPicked();
}

let typing = 0, relayout = 0;
$('text').oninput = () => {
  clearTimeout(typing);
  typing = setTimeout(() => {
    score = $('text').value;
    if (engrave()) sayShown();
  }, 500);
};
const later = () => {
  clearTimeout(relayout);
  relayout = setTimeout(() => { if (shown && engrave()) sayShown(); }, 250);
};
$('title').oninput = $('subtitle').oninput = $('composer').oninput = $('bpm').oninput = later;
$('lines').onchange = e => { cfg.lines = e.target.checked; saveSettings(); later(); };
$('paper').onchange = e => { cfg.paper = e.target.value; saveSettings(); later(); };
$('size').oninput = e => { cfg.size = +e.target.value; saveSettings(); later(); };
$('tempo').oninput = e => {
  cfg.tempo = +e.target.value; saveSettings();
  if (playing) { stopPlaying(true); play(); }   // carry on at the new speed
};
$('instrument').onchange = e => {
  cfg.instrument = e.target.value; saveSettings();
  if (playing) { stopPlaying(true); play(); }
};
$('play').onclick = play;
$('stop').onclick = () => stopPlaying();
$('flat').onclick = () => change({ set: -1 });
$('natural').onclick = () => change({ set: 0 });
$('sharp').onclick = () => change({ set: 1 });
$('down2').onclick = () => change({ by: -2 });
$('down1').onclick = () => change({ by: -1 });
$('up1').onclick = () => change({ by: 1 });
$('up2').onclick = () => change({ by: 2 });
// the metronome opens at the tempo of the score
$('metronome').onclick = e => { const bpm = +$('bpm').value; e.currentTarget.href = '../metronome/' + (bpm ? '?bpm=' + bpm : ''); };
$('pdf').onclick = savePdf;
$('print').onclick = printPdf;
$('saveSource').onclick = saveSource;
$('midi').onclick = saveMidi;
$('showSource').onclick = () => showSource($('source').hidden);
$('tabPicture').onclick = () => showSource(true, 'picture');
$('tabText').onclick = () => showSource(true, 'text');
$('open').onclick = $('empty').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; };
$('lang').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('score-lang', lang); } catch {}
  applyLang();
};

// A click on a note picks it: playback is moved there, and the note can be changed.
$('pages').onclick = e => {
  const el = e.target.closest?.('.note');
  if (!el) return;
  const first = events.find(x => x.id === el.id);
  const wasPlaying = !!playing;
  stopPlaying(true);
  selected = el.id;
  if (first) position = first.time;
  showPicked();
  paint();
  if (wasPlaying) play();
};

const inField = () => /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement?.tagName || '');

addEventListener('paste', e => {
  if (inField()) return;
  const image = [...e.clipboardData.files].find(f => f.type.startsWith('image/'));
  const text = e.clipboardData.getData('text/plain');
  if (image) { e.preventDefault(); name = 'score'; recognise(image); }
  // score text pasted onto the page: MusicXML, MEI or ABC
  else if (/^\s*(<\?xml|<score-|<mei|X:\s*\d)/.test(text)) { e.preventDefault(); name = 'score'; forget(); setScore(text); }
  else toast(t('nothing'), true);
});

addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', () => document.body.classList.remove('dragging'));
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]);
});

addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); savePdf(); }
  else if (mod && k === 'p' && shown) { e.preventDefault(); printPdf(); }
  else if (inField() || !shown) return;
  else if (mod && k === 'z') { e.preventDefault(); undo(); }
  else if (k === ' ' && !mod) { e.preventDefault(); play(); }
  else if ((k === 'arrowup' || k === 'arrowdown') && selected && !mod) {
    e.preventDefault();
    change({ by: (k === 'arrowup' ? 1 : -1) * (e.shiftKey ? 2 : 1) });
  }
});
new ResizeObserver(() => placeCursor()).observe($('stage'));

showSettings();
showSource(false);
applyLang();
engine.then(() => { if (status.key === 'engine') say('ready'); }, err => { console.error(err); say('engineFailed', '', true); });

// for trying things out from the console
window.scoreReader = {
  setScore, recognise, makePdf, readHeader, change, play,
  get events() { return events; }, get status() { return status; }, get position() { return now(); }, get score() { return score; },
};
