<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Unlisted personal tool: not linked from the homepage, not in the sitemap. -->
<meta name="robots" content="noindex, nofollow">
<title>Free Crop</title>
<link rel="icon" href="icon.svg">
<style>
  :root {
    --bg: #17181b; --panel: #212327; --line: #34373d; --text: #e9eaec;
    --muted: #979da6; --accent: #4c9dff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .hint { margin-left: auto; color: var(--muted); font-size: 13px; }
  button {
    font: inherit; color: var(--text); background: #2d3035;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #383c42; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #6aadff; }
  .seg { display: flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #empty {
    position: absolute; inset: 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
    border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); cursor: pointer;
  }
  #empty[hidden] { display: none; }
  #empty b { font-size: 20px; font-weight: 600; color: var(--text); }
  body.dragging #stage { outline: 2px solid var(--accent); outline-offset: -2px; }

  aside {
    width: 280px; flex: none; display: flex; flex-direction: column; gap: 12px;
    padding: 14px; background: var(--panel); border-left: 1px solid var(--line);
  }
  aside h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  #preview {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #777; font-size: 13px;
    background: repeating-conic-gradient(#fff 0 25%, #dcdcdc 0 50%) 0 0 / 16px 16px;
  }
  #preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #preview img[hidden] { display: none; }
  #size { color: var(--muted); font-size: 13px; min-height: 1.5em; }
  aside .row { display: flex; gap: 8px; }
  aside .row button { flex: 1; }
  aside label { display: flex; align-items: flex-start; gap: 6px; color: var(--muted); font-size: 13px; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 8px; background: #2f7d4f; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast.bad { background: #a13c3c; }
</style>
</head>
<body>
<header>
  <button id="open" data-i18n="open"></button>
  <div class="seg">
    <button id="lasso" class="on" data-i18n="lasso"></button>
    <button id="rect" data-i18n="rect"></button>
  </div>
  <span class="hint" data-i18n="hint"></span>
  <button id="lang"></button>
</header>
<main>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="empty">
      <b data-i18n="emptyTitle"></b>
      <span data-i18n="emptySub"></span>
    </div>
  </div>
  <aside>
    <h2 data-i18n="resultTitle"></h2>
    <div id="preview"><span id="placeholder" data-i18n="placeholder"></span><img id="out" alt="" hidden></div>
    <div id="size"></div>
    <div class="row">
      <button id="copy" class="primary" disabled data-i18n="copy"></button>
      <button id="save" disabled data-i18n="save"></button>
    </div>
    <label><input type="checkbox" id="auto" checked> <span data-i18n="auto"></span></label>
  </aside>
</main>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), view = $('view'), ctx = view.getContext('2d');

// English unless the other language was picked with the toggle before.
const TEXT = {
  en: {
    title: 'Free Crop', other: '中文',
    open: 'Open image', lasso: 'Freehand', rect: 'Rectangle',
    hint: 'Ctrl+V to paste an image · drag to select · Esc to start over',
    emptyTitle: 'Press Ctrl+V to paste a screenshot',
    emptySub: 'or drop an image here / click to choose a file',
    resultTitle: 'Result (transparent square PNG)',
    placeholder: 'The preview appears here',
    copy: 'Copy (Ctrl+C)', save: 'Save (Ctrl+S)',
    auto: 'Copy to the clipboard as soon as a selection is made',
    copied: 'Copied to clipboard', copyFailed: 'Copy failed, use Save instead',
    noImage: 'No image in the clipboard', badImage: 'Could not read this image',
  },
  zh: {
    title: '自由裁剪', other: 'English',
    open: '打开图片', lasso: '自由圈选', rect: '矩形',
    hint: 'Ctrl+V 粘贴图片 · 按住左键拖动圈选 · Esc 重选',
    emptyTitle: 'Ctrl+V 粘贴截图',
    emptySub: '或把图片拖进来 / 点击这里选择文件',
    resultTitle: '结果（透明背景 · 方形 PNG）',
    placeholder: '圈选后在这里预览',
    copy: '复制 (Ctrl+C)', save: '保存 (Ctrl+S)',
    auto: '圈选完成后自动复制到剪贴板',
    copied: '已复制到剪贴板', copyFailed: '复制失败，请用「保存」',
    noImage: '剪贴板里没有图片', badImage: '无法读取这张图片',
  },
};
let lang = 'en';
try { if (localStorage.getItem('crop-lang') === 'zh') lang = 'zh'; } catch {}
const t = key => TEXT[lang][key];

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('lang').textContent = t('other');
}

let img = null;                  // ImageBitmap being cropped
let fit = { x: 0, y: 0, k: 1 };  // image px -> CSS px on the stage
let mode = 'lasso';
let sel = null;                  // { type, pts } in image coordinates
let drawing = false;
let result = null;               // { side, blob: Promise<Blob>, url }
let raf = 0, toastTimer = 0;

function toast(key, bad) {
  const el = $('toast');
  el.textContent = t(key);
  el.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = bad ? 'bad' : '', 1800);
}

async function load(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { toast('badImage', true); return; }
  img?.close();
  img = bmp;
  sel = null;
  setResult(null);
  $('empty').hidden = true;
  layout();
}

function layout() {
  const dpr = devicePixelRatio || 1, w = stage.clientWidth, h = stage.clientHeight;
  view.width = Math.round(w * dpr);
  view.height = Math.round(h * dpr);
  if (img) {
    const pad = 20, k = Math.min((w - 2 * pad) / img.width, (h - 2 * pad) / img.height, 2);
    fit = { k, x: (w - img.width * k) / 2, y: (h - img.height * k) / 2 };
  }
  draw();
}

function selPath(s) {
  const p = new Path2D(), pts = s.pts, n = pts.length;
  if (s.type === 'rect') {
    const [a, b] = pts;
    p.rect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(a.x - b.x), Math.abs(a.y - b.y));
  } else if (n < 3) {
    p.moveTo(pts[0].x, pts[0].y);
    for (const q of pts) p.lineTo(q.x, q.y);
  } else {
    // closed loop, smoothed by curving through the midpoints of the raw points
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
    const m0 = mid(pts[n - 1], pts[0]);
    p.moveTo(m0.x, m0.y);
    for (let i = 0; i < n; i++) {
      const m = mid(pts[i], pts[(i + 1) % n]);
      p.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y);
    }
    p.closePath();
  }
  return p;
}

function selBox(s) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of s.pts) {
    x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y);
    x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y);
  }
  x0 = Math.floor(x0); y0 = Math.floor(y0); x1 = Math.ceil(x1); y1 = Math.ceil(y1);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function draw() {
  raf = 0;
  const dpr = devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, view.width, view.height);
  if (!img) return;
  ctx.setTransform(dpr * fit.k, 0, 0, dpr * fit.k, dpr * fit.x, dpr * fit.y);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0);
  if (!sel || sel.pts.length < 2) return;

  // dim everything, then repaint the selected part at full brightness
  const p = selPath(sel), px = 1 / fit.k;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fillRect(0, 0, img.width, img.height);
  ctx.save();
  ctx.clip(p);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
  ctx.lineWidth = 1.5 * px;
  ctx.setLineDash([]);
  ctx.strokeStyle = '#fff';
  ctx.stroke(p);
  ctx.setLineDash([5 * px, 5 * px]);
  ctx.strokeStyle = '#111';
  ctx.stroke(p);
}
const redraw = () => { raf ||= requestAnimationFrame(draw); };

function toImg(e) {
  const r = view.getBoundingClientRect();
  const clamp = (v, max) => Math.max(0, Math.min(max, v));
  const p = {
    x: clamp((e.clientX - r.left - fit.x) / fit.k, img.width),
    y: clamp((e.clientY - r.top - fit.y) / fit.k, img.height),
  };
  if (mode === 'rect') { p.x = Math.round(p.x); p.y = Math.round(p.y); }
  return p;
}

view.addEventListener('pointerdown', e => {
  if (!img || e.button !== 0) return;
  try { view.setPointerCapture(e.pointerId); } catch {}
  drawing = true;
  const p = toImg(e);
  sel = { type: mode, pts: mode === 'rect' ? [p, p] : [p] };
  redraw();
});

view.addEventListener('pointermove', e => {
  if (!drawing) return;
  if (sel.type === 'rect') {
    sel.pts[1] = toImg(e);
  } else {
    const evs = e.getCoalescedEvents?.();
    for (const ev of evs?.length ? evs : [e]) {
      const p = toImg(ev), last = sel.pts[sel.pts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) * fit.k >= 2) sel.pts.push(p);
    }
  }
  redraw();
});

function finish() {
  if (!drawing) return;
  drawing = false;
  const b = selBox(sel);
  if (b.w < 4 || b.h < 4 || (sel.type === 'lasso' && sel.pts.length < 3)) {
    sel = null;
    setResult(null);
    redraw();
    return;
  }
  // cut the selection out and centre it on a transparent square
  const side = Math.max(b.w, b.h), c = document.createElement('canvas');
  c.width = c.height = side;
  const g = c.getContext('2d');
  g.translate(Math.floor((side - b.w) / 2) - b.x, Math.floor((side - b.h) / 2) - b.y);
  g.clip(selPath(sel));
  g.drawImage(img, 0, 0);
  setResult({ side, blob: new Promise(res => c.toBlob(res, 'image/png')) });
  if ($('auto').checked) copy();
  redraw();
}
view.addEventListener('pointerup', finish);
view.addEventListener('pointercancel', finish);

function setResult(r) {
  if (result?.url) URL.revokeObjectURL(result.url);
  result = r;
  $('copy').disabled = $('save').disabled = !r;
  $('out').hidden = true;
  $('placeholder').hidden = !!r;
  $('size').textContent = r ? `${r.side} × ${r.side} px` : '';
  r?.blob.then(b => {
    if (result !== r) return;
    r.url = URL.createObjectURL(b);
    $('out').src = r.url;
    $('out').hidden = false;
  });
}

async function copy() {
  if (!result) return;
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': result.blob })]);
    toast('copied');
  } catch {
    toast('copyFailed', true);
  }
}

async function save() {
  if (!result) return;
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(await result.blob);
  a.download = `crop-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function setMode(m) {
  mode = m;
  $('lasso').classList.toggle('on', m === 'lasso');
  $('rect').classList.toggle('on', m === 'rect');
}

$('lasso').onclick = () => setMode('lasso');
$('rect').onclick = () => setMode('rect');
$('copy').onclick = copy;
$('save').onclick = save;
$('open').onclick = $('empty').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); e.target.value = ''; };
$('lang').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('crop-lang', lang); } catch {}
  applyLang();
};

addEventListener('paste', e => {
  const f = [...e.clipboardData.files].find(f => f.type.startsWith('image/'));
  if (!f) { toast('noImage', true); return; }
  e.preventDefault();
  load(f);
});

addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', () => document.body.classList.remove('dragging'));
addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) load(f);
});

addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (k === 'escape') {
    drawing = false;
    sel = null;
    setResult(null);
    redraw();
  } else if (mod && k === 'c' && result) {
    e.preventDefault();
    copy();
  } else if (mod && k === 's') {
    e.preventDefault();
    save();
  }
});

applyLang();
new ResizeObserver(layout).observe(stage);
</script>
</body>
</html>
